name: Route Ops operations
run-name: Route Ops / ${{ inputs.operation }} / ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run; use the runbook input table"
        required: true
        type: choice
        options:
          - deploy
          - edge_caddy
          - backup_setup
          - docker_cleanup
          - completion_evidence
          - alarm_canary
          - invariant_mode
        default: deploy
      channel_tag:
        description: "[deploy] Mutable GHCR channel tag"
        required: true
        default: prod
      source_ref:
        description: "Main-history ref to check out"
        required: true
        default: main
      publish_images:
        description: "[deploy] Build and push changed images"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "[deploy/caddy/backup/cleanup] Validate without mutation"
        required: true
        type: boolean
        default: true
      run_migrations:
        description: "[deploy] Run guarded production migrations"
        required: true
        type: boolean
        default: false
      approve_dsv_migration:
        description: "[deploy] Approve guarded DSV migration"
        required: true
        type: boolean
        default: false
      restore_rehearsal_sha256:
        description: "[deploy] Reviewed restore rehearsal SHA-256"
        required: false
        type: string
        default: ""
      approve_production_baseline:
        description: "[deploy] Approve migration-history baseline"
        required: true
        type: boolean
        default: false
      skip_smoke:
        description: "[edge_caddy] Skip public smoke after a real reload"
        required: true
        type: boolean
        default: false
      run_backup:
        description: "[backup_setup] Run one backup after timer setup"
        required: true
        type: boolean
        default: false
      source_sha:
        description: "[completion operations] Exact deployed runtime SHA"
        required: false
        type: string
        default: ""
      target_mode:
        description: "[invariant_mode] Target mode"
        required: true
        type: choice
        options: [OBSERVE, GUARDED, FULL]
        default: OBSERVE
      evidence_artifact_id:
        description: "[invariant_mode] completion_evidence artifact ID"
        required: false
        type: string
        default: ""
      alarm_receipt_artifact_id:
        description: "[invariant_mode] alarm_canary artifact ID"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write

concurrency:
  group: route-ops-operations
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DELIVERY_API_IMAGE_REPO: ghcr.io/evnsolution/clever-route-server-delivery-api
  DELIVERY_API_MIGRATION_IMAGE_REPO: ghcr.io/evnsolution/clever-route-server-delivery-api-migration
  ROUTE_OPS_WEB_STATIC_IMAGE_REPO: ghcr.io/evnsolution/clever-route-server-route-ops-web-static

# One manual entry point routes through an explicit job graph. The selected operation
# branch owns its fail-closed wrapper; CI-grade tests stay in CI.
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.route.outputs.operation }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Route Ops operations must run from refs/heads/main." >&2
          exit 1

      - name: Require actor allowlist
        shell: bash
        env:
          DEPLOY_ALLOWED_ACTORS: ${{ vars.DEPLOY_ALLOWED_ACTORS }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ALLOWED_ACTORS//[[:space:],]/}" ]; then
            echo "DEPLOY_ALLOWED_ACTORS is required and must fail closed before Route Ops operations." >&2
            exit 1
          fi
          IFS=',' read -ra actors <<< "$DEPLOY_ALLOWED_ACTORS"
          allowed=false
          for actor in "${actors[@]}"; do
            actor="$(echo "$actor" | xargs)"
            if [ "$actor" = "$GITHUB_ACTOR_NAME" ]; then allowed=true; fi
          done
          if [ "$allowed" != true ]; then
            echo "$GITHUB_ACTOR_NAME is not allowed to run Route Ops operations." >&2
            exit 1
          fi

      - name: Select operation branch
        id: route
        run: echo "operation=${{ inputs.operation }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: route
    if: needs.route.outputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Capture source SHA
        id: source
        run: echo "sha=$(git rev-parse --short=40 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for exact source SHA
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          count="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="$SOURCE_SHA" \
            -f per_page=1 \
            --jq '.total_count')"
          test "$count" -gt 0

      - name: Resolve DSV migration approval evidence
        if: inputs.operation == 'deploy' && inputs.run_migrations == true
        id: migration
        shell: bash
        env:
          APPROVED: ${{ inputs.approve_dsv_migration }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESTORE_REHEARSAL_SHA256: ${{ inputs.restore_rehearsal_sha256 }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          set -euo pipefail
          manifest_sha256="$(shasum -a 256 docs/migration/g007-baseline-manifest.md | awk '{print $1}')"
          production_baseline_manifest_sha256="$(shasum -a 256 apps/delivery-api/prisma/production-baselines/dsv-production-20260723.json | awk '{print $1}')"
          if [ "$RUN_MIGRATIONS" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            test "$APPROVED" = "true" || { echo "approve_dsv_migration=true is required for a production rollout" >&2; exit 1; }
            [[ "$RESTORE_REHEARSAL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "restore_rehearsal_sha256 must be 64 lowercase hex characters" >&2; exit 1; }
          fi
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "production_baseline_manifest_sha256=$production_baseline_manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Require source on main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate simple deploy wrapper
        if: inputs.operation == 'deploy'
        run: |
          bash -n scripts/ssm-simple-route-ops-deploy.sh tests/deploy/ssm-simple-route-ops-deploy.test.sh
          tests/deploy/ssm-simple-route-ops-deploy.test.sh

      - name: Configure AWS credentials through OIDC
        # aws-actions/configure-aws-credentials v6.2.0 (Node 24) pinned to full commit SHA.
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROUTE_OPS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Read current production image env
        if: inputs.operation == 'deploy'
        id: current
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          SSM_TAG_KEY: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_KEY || 'Service' }}
          SSM_TAG_VALUE: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_VALUE || 'clever-delivery-server' }}
        run: |
          set -euo pipefail
          ssm_target="$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" \
            --query '[length(InstanceInformationList), InstanceInformationList[0].InstanceId, InstanceInformationList[0].PingStatus]' \
            --output text)"
          read -r count instance_id ping_status <<< "$ssm_target"
          test "$count" = "1"
          test "$ping_status" = "Online"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --comment "Route Ops read current image env" \
            --parameters commands='["cd /srv/clever-route-server && cat .deploy/current-image.env 2>/dev/null || true"]' \
            --query Command.CommandId \
            --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query StandardOutputContent \
            --output text > current-image.env
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          values = {}
          for line in Path('current-image.env').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  values[key] = value
          print(f"deployed_commit={values.get('COMMIT_SHA', '')}")
          print(f"runtime_commit={values.get('API_RUNTIME_REVISION', values.get('COMMIT_SHA', ''))}")
          print(f"delivery_api_image={values.get('DELIVERY_API_IMAGE', '')}")
          print(f"delivery_api_migration_image={values.get('DELIVERY_API_MIGRATION_IMAGE', values.get('DELIVERY_API_IMAGE', ''))}")
          print(f"route_ops_web_static_image={values.get('ROUTE_OPS_WEB_STATIC_IMAGE', '')}")
          PY

      - name: Detect image build scope
        if: inputs.operation == 'deploy'
        id: changes
        shell: bash
        env:
          DEPLOYED_COMMIT: ${{ steps.current.outputs.deployed_commit }}
          API_RUNTIME_COMMIT: ${{ steps.current.outputs.runtime_commit }}
          CURRENT_DELIVERY_API_IMAGE: ${{ steps.current.outputs.delivery_api_image }}
          CURRENT_DELIVERY_API_MIGRATION_IMAGE: ${{ steps.current.outputs.delivery_api_migration_image }}
          CURRENT_ROUTE_OPS_WEB_STATIC_IMAGE: ${{ steps.current.outputs.route_ops_web_static_image }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          set -euo pipefail
          files=""
          if [ -n "$DEPLOYED_COMMIT" ] && git cat-file -e "${DEPLOYED_COMMIT}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$DEPLOYED_COMMIT" HEAD; then
            files="$(git -c core.quotePath=false diff --name-only "$DEPLOYED_COMMIT" HEAD)"
          else
            files="$(git -c core.quotePath=false ls-files)"
          fi
          if [ -n "$API_RUNTIME_COMMIT" ] && git cat-file -e "${API_RUNTIME_COMMIT}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$API_RUNTIME_COMMIT" HEAD; then
            api_files="$(git -c core.quotePath=false diff --name-only "$API_RUNTIME_COMMIT" HEAD)"
          else
            api_files="$(git -c core.quotePath=false ls-files)"
          fi
          printf '%s\n' "$files" > changed-files.txt
          printf '%s\n' "$api_files" > api-changed-files.txt
          build_api=false
          build_web=false
          prisma_changed=false
          if printf '%s\n' "$api_files" | grep -Eq '^apps/delivery-api/prisma/'; then
            prisma_changed=true
          fi
          if [ "$prisma_changed" = "true" ] && [ "$RUN_MIGRATIONS" != "true" ]; then
            echo "Prisma inputs changed since the deployed API revision; run_migrations=true and reviewed migration evidence are required." >&2
            exit 1
          fi
          if [ "$PUBLISH_IMAGES" = "true" ]; then
            if [ -z "$CURRENT_DELIVERY_API_IMAGE" ] || printf '%s\n' "$api_files" | grep -Eq '^(apps/delivery-api/|\.dockerignore$)'; then
              build_api=true
            fi
            if [ -z "$CURRENT_ROUTE_OPS_WEB_STATIC_IMAGE" ] || printf '%s\n' "$files" | grep -Eq '^(apps/route-ops-web/|\.dockerignore$)'; then
              build_web=true
            fi
          fi
          {
            echo "build_api=$build_api"
            echo "build_web=$build_web"
            echo "prisma_changed=$prisma_changed"
            echo "run_migrations=$RUN_MIGRATIONS"
            echo "changed_files<<EOF_CHANGED"
            cat changed-files.txt
            echo "EOF_CHANGED"
            echo "api_changed_files<<EOF_API_CHANGED"
            cat api-changed-files.txt
            echo "EOF_API_CHANGED"
          } >> "$GITHUB_OUTPUT"
          printf 'build_api=%s build_web=%s\n' "$build_api" "$build_web"

      - name: Login to GHCR
        if: inputs.operation == 'deploy'
        # docker/login-action v4.2.0 (Node 24) pinned to full commit SHA.
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: inputs.operation == 'deploy'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Route Ops web static image
        id: build_web
        if: steps.changes.outputs.build_web == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/route-ops-web/Dockerfile
          target: static
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.ROUTE_OPS_WEB_STATIC_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.ROUTE_OPS_WEB_STATIC_IMAGE_REPO }}:${{ inputs.channel_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.clever-route.prisma-schema-sha=${{ hashFiles('apps/delivery-api/prisma/schema.prisma') }}
            org.clever-route.image-role=route-ops-web-static
          cache-from: type=registry,ref=${{ env.ROUTE_OPS_WEB_STATIC_IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ROUTE_OPS_WEB_STATIC_IMAGE_REPO }}:buildcache,mode=max

      - name: Build and push delivery API image
        id: build_api
        if: steps.changes.outputs.build_api == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/delivery-api/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.DELIVERY_API_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.DELIVERY_API_IMAGE_REPO }}:${{ inputs.channel_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.clever-route.prisma-schema-sha=${{ hashFiles('apps/delivery-api/prisma/schema.prisma') }}
            org.clever-route.image-role=runtime
            org.clever-route.route-completion-invariant-capability=1
          cache-from: type=registry,ref=${{ env.DELIVERY_API_IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DELIVERY_API_IMAGE_REPO }}:buildcache,mode=max

      - name: Build and push delivery API migration image
        id: build_migration
        if: steps.changes.outputs.build_api == 'true' && steps.changes.outputs.run_migrations == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/delivery-api/Dockerfile
          target: migration
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.DELIVERY_API_MIGRATION_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.DELIVERY_API_MIGRATION_IMAGE_REPO }}:${{ inputs.channel_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.clever-route.prisma-schema-sha=${{ hashFiles('apps/delivery-api/prisma/schema.prisma') }}
            org.clever-route.image-role=migration
          cache-from: type=registry,ref=${{ env.DELIVERY_API_MIGRATION_IMAGE_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DELIVERY_API_MIGRATION_IMAGE_REPO }}:buildcache,mode=max

      - name: Resolve deploy image refs
        if: inputs.operation == 'deploy'
        id: images
        shell: bash
        env:
          CHANNEL_TAG: ${{ inputs.channel_tag }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
          BUILD_API: ${{ steps.changes.outputs.build_api }}
          BUILD_WEB: ${{ steps.changes.outputs.build_web }}
          RUN_MIGRATIONS: ${{ steps.changes.outputs.run_migrations }}
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          MIGRATION_DIGEST: ${{ steps.build_migration.outputs.digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
          CURRENT_DELIVERY_API_IMAGE: ${{ steps.current.outputs.delivery_api_image }}
          CURRENT_DELIVERY_API_MIGRATION_IMAGE: ${{ steps.current.outputs.delivery_api_migration_image }}
          CURRENT_ROUTE_OPS_WEB_STATIC_IMAGE: ${{ steps.current.outputs.route_ops_web_static_image }}
          DELIVERY_API_IMAGE_REPO: ${{ env.DELIVERY_API_IMAGE_REPO }}
          DELIVERY_API_MIGRATION_IMAGE_REPO: ${{ env.DELIVERY_API_MIGRATION_IMAGE_REPO }}
          ROUTE_OPS_WEB_STATIC_IMAGE_REPO: ${{ env.ROUTE_OPS_WEB_STATIC_IMAGE_REPO }}
        run: |
          set -euo pipefail
          resolve_digest_ref() {
            local image="$1"
            local repo digest
            if [[ "$image" == *@sha256:* ]]; then
              printf '%s\n' "$image"
              return 0
            fi
            repo="${image%:*}"
            if ! digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"; then
              echo "failed to resolve image digest: $image" >&2
              return 1
            fi
            [[ "$digest" == sha256:* ]] || return 1
            printf '%s@%s\n' "$repo" "$digest"
          }
          if [ "$BUILD_API" = "true" ]; then
            delivery_api_image="${DELIVERY_API_IMAGE_REPO}@${API_DIGEST}"
          elif [ "$PUBLISH_IMAGES" = "false" ]; then
            delivery_api_image="$(resolve_digest_ref "${DELIVERY_API_IMAGE_REPO}:${CHANNEL_TAG}")"
          else
            delivery_api_image="$(resolve_digest_ref "$CURRENT_DELIVERY_API_IMAGE")"
          fi
          delivery_api_migration_image=""
          if [ "$RUN_MIGRATIONS" = "true" ]; then
            if [ "$BUILD_API" = "true" ]; then
              delivery_api_migration_image="${DELIVERY_API_MIGRATION_IMAGE_REPO}@${MIGRATION_DIGEST}"
            elif [ "$PUBLISH_IMAGES" = "false" ]; then
              delivery_api_migration_image="$(resolve_digest_ref "${DELIVERY_API_MIGRATION_IMAGE_REPO}:${CHANNEL_TAG}")"
            else
              delivery_api_migration_image="$(resolve_digest_ref "$CURRENT_DELIVERY_API_MIGRATION_IMAGE")"
            fi
          fi
          if [ "$BUILD_WEB" = "true" ]; then
            route_ops_web_static_image="${ROUTE_OPS_WEB_STATIC_IMAGE_REPO}@${WEB_DIGEST}"
          elif [ "$PUBLISH_IMAGES" = "false" ]; then
            route_ops_web_static_image="$(resolve_digest_ref "${ROUTE_OPS_WEB_STATIC_IMAGE_REPO}:${CHANNEL_TAG}")"
          else
            route_ops_web_static_image="$(resolve_digest_ref "$CURRENT_ROUTE_OPS_WEB_STATIC_IMAGE")"
          fi
          {
            echo "delivery_api_image=$delivery_api_image"
            echo "delivery_api_migration_image=$delivery_api_migration_image"
            echo "route_ops_web_static_image=$route_ops_web_static_image"
          } >> "$GITHUB_OUTPUT"
          mkdir -p deploy-selection
          cat > deploy-selection/route-ops-simple-image-selection.json <<JSON
          {
            "commitSha": "${{ steps.source.outputs.sha }}",
            "channelTag": "$CHANNEL_TAG",
            "buildApi": $BUILD_API,
            "buildWeb": $BUILD_WEB,
            "runMigrations": $RUN_MIGRATIONS,
            "prismaChanged": ${{ steps.changes.outputs.prisma_changed }},
            "deliveryApiImage": "$delivery_api_image",
            "deliveryApiMigrationImage": "$delivery_api_migration_image",
            "routeOpsWebStaticImage": "$route_ops_web_static_image",
            "previousDeliveryApiImage": "$CURRENT_DELIVERY_API_IMAGE",
            "previousDeliveryApiMigrationImage": "$CURRENT_DELIVERY_API_MIGRATION_IMAGE",
            "previousRouteOpsWebStaticImage": "$CURRENT_ROUTE_OPS_WEB_STATIC_IMAGE"
          }
          JSON
          cat deploy-selection/route-ops-simple-image-selection.json

      - name: Upload deploy image selection
        if: inputs.operation == 'deploy'
        uses: actions/upload-artifact@v7
        with:
          name: route-ops-simple-image-selection
          path: deploy-selection/route-ops-simple-image-selection.json
          if-no-files-found: error
          retention-days: 7

      - name: Deploy via simple SSM lane
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          ROUTE_OPS_RUNTIME_IMAGE: ${{ steps.images.outputs.delivery_api_image }}
          ROUTE_OPS_MIGRATION_IMAGE: ${{ steps.images.outputs.delivery_api_migration_image }}
          ROUTE_OPS_RUN_MIGRATIONS: ${{ steps.changes.outputs.run_migrations == 'true' && '1' || '0' }}
          ROUTE_OPS_WEB_STATIC_IMAGE: ${{ steps.images.outputs.route_ops_web_static_image }}
          ROUTE_OPS_SIMPLE_CHANNEL_TAG: ${{ inputs.channel_tag }}
          DSV_MIGRATION_APPROVED: ${{ inputs.approve_dsv_migration && '1' || '' }}
          DSV_MIGRATION_MANIFEST_SHA256: ${{ steps.migration.outputs.manifest_sha256 }}
          DSV_RESTORE_REHEARSAL_SHA256: ${{ inputs.restore_rehearsal_sha256 }}
          DSV_PRODUCTION_BASELINE_APPROVED: ${{ inputs.approve_production_baseline && '1' || '' }}
          DSV_PRODUCTION_BASELINE_MANIFEST_SHA256: ${{ steps.migration.outputs.production_baseline_manifest_sha256 }}
          ROUTE_OPS_UVIS_ENV_PARAM: ${{ vars.ROUTE_OPS_UVIS_ENV_PARAM }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          scripts/ssm-simple-route-ops-deploy.sh "${args[@]}"

      - name: Operation summary
        if: always()
        run: |
          {
            echo "### Route Ops operation"
            echo "- operation: ${{ inputs.operation }}"
            echo "- source: ${{ steps.source.outputs.sha }}"
            echo "- dry run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"

  edge_caddy:
    needs: route
    if: needs.route.outputs.operation == 'edge_caddy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Require source on main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROUTE_OPS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Validate Edge Caddy wrapper
        run: |
          bash -n scripts/ssm-edge-caddy-deploy.sh tests/deploy/ssm-edge-caddy-deploy.test.sh
          tests/deploy/ssm-edge-caddy-deploy.test.sh

      - name: Run Edge Caddy operation
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          EDGE_CADDY_SSM_TAG_KEY: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_KEY || 'Service' }}
          EDGE_CADDY_SSM_TAG_VALUE: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_VALUE || 'clever-delivery-server' }}
          EDGE_CADDY_SKIP_SMOKE: ${{ inputs.skip_smoke && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          scripts/ssm-edge-caddy-deploy.sh "${args[@]}"

  backup_setup:
    needs: route
    if: needs.route.outputs.operation == 'backup_setup'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Require source on main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROUTE_OPS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Validate backup wrapper
        run: |
          chmod +x scripts/backup-route-ops-data.sh scripts/ssm-install-route-ops-backup.sh tests/deploy/route-ops-backup.test.sh
          tests/deploy/route-ops-backup.test.sh

      - name: Run backup setup operation
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          ROUTE_OPS_BACKUP_SSM_TAG_KEY: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_KEY || 'Service' }}
          ROUTE_OPS_BACKUP_SSM_TAG_VALUE: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_VALUE || 'clever-delivery-server' }}
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.dry_run }}" = true ]; then args+=(--dry-run); fi
          if [ "${{ inputs.run_backup }}" = true ]; then args+=(--run-backup); fi
          scripts/ssm-install-route-ops-backup.sh "${args[@]}"

  docker_cleanup:
    needs: route
    if: needs.route.outputs.operation == 'docker_cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Require source on main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROUTE_OPS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Validate Docker cleanup wrapper
        run: |
          chmod +x scripts/route-ops-docker-cleanup.sh scripts/ssm-route-ops-docker-cleanup.sh tests/deploy/route-ops-docker-cleanup.test.sh
          bash -n scripts/route-ops-docker-cleanup.sh scripts/ssm-route-ops-docker-cleanup.sh tests/deploy/route-ops-docker-cleanup.test.sh
          tests/deploy/route-ops-docker-cleanup.test.sh

      - name: Run Docker cleanup operation
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          ROUTE_OPS_SSM_TAG_KEY: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_KEY || 'Service' }}
          ROUTE_OPS_SSM_TAG_VALUE: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_VALUE || 'clever-delivery-server' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = true ]; then
            scripts/ssm-route-ops-docker-cleanup.sh --dry-run
          else
            scripts/ssm-route-ops-docker-cleanup.sh
          fi

  completion_evidence:
    needs: route
    if: needs.route.outputs.operation == 'completion_evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Validate completion operation inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be the exact 40-character deployed runtime SHA." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Require source on main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Require exact successful main SHA for completion evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$SOURCE_SHA&per_page=1" --jq '.total_count')" -gt 0

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROUTE_OPS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Collect completion evidence
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SSM_TAG_KEY: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_KEY || 'Service' }}
          SSM_TAG_VALUE: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_VALUE || 'clever-delivery-server' }}
        run: |
          set -euo pipefail
          read -r count instance_id ping_status <<<"$(aws ssm describe-instance-information --region "$AWS_REGION" --filters "Key=tag:${SSM_TAG_KEY},Values=${SSM_TAG_VALUE}" --query '[length(InstanceInformationList), InstanceInformationList[0].InstanceId, InstanceInformationList[0].PingStatus]' --output text)"
          test "$count" = 1
          test "$ping_status" = Online
          command="cd /srv/clever-route-server && lock=.deploy/route-ops-simple-deploy.lock.d && mkdir \"\$lock\" && trap 'rmdir \"\$lock\"' EXIT && container=clever-route-clever-route-api-1 && expected_image=\$(sed -n 's/^DELIVERY_API_IMAGE=//p' .deploy/current-image.env) && image_id=\$(docker image inspect \"\$expected_image\" --format '{{.Id}}') && repo_digest=\$expected_image && revision=\$(docker inspect \"\$container\" --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}') && capability=\$(docker inspect \"\$container\" --format '{{ index .Config.Labels \"org.clever-route.route-completion-invariant-capability\" }}') && [[ \"\$repo_digest\" =~ @sha256:[0-9a-f]{64}\$ ]] && docker image inspect \"\$repo_digest\" >/dev/null && test \"\$capability\" = 1 && test \"\$(docker inspect \"\$container\" --format '{{.Config.Image}}')\" = \"\$repo_digest\" && test \"\$revision\" = '$SOURCE_SHA' && test \"\$(docker inspect \"\$container\" --format '{{.Image}}')\" = \"\$image_id\" && docker compose -p clever-route --env-file .deploy/current-image.env -f infra/compose/docker-compose.prod.yml exec -T clever-route-api node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\" && report=\$(docker compose -p clever-route --env-file .deploy/current-image.env -f infra/compose/docker-compose.prod.yml exec -T clever-route-api node dist/scripts/report-driver-route-completion-invariant.js --source-sha '$SOURCE_SHA') && jq -c --arg imageId \"\$image_id\" --arg imageRepoDigest \"\$repo_digest\" --arg revision \"\$revision\" '. + {runtime:{capabilityVersion:1,imageId:\$imageId,imageRepoDigest:\$imageRepoDigest,revision:\$revision}}' <<<\"\$report\""
          parameters="$(jq -cn --arg command "$command" '{commands:["bash -lc " + ($command|@sh)]}')"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$instance_id" --document-name AWS-RunShellScript --comment "Read-only route completion evidence at $SOURCE_SHA" --parameters "$parameters" --query Command.CommandId --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id"
          test "$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id" --query ResponseCode --output text)" = 0
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance_id" --query StandardOutputContent --output text > route-completion-rollout-evidence.json
          jq -e --arg sha "$SOURCE_SHA" '.sourceSha == $sha and .runtime.revision == $sha and .runtime.capabilityVersion == 1 and (.runtime.imageId | startswith("sha256:")) and (.runtime.imageRepoDigest | contains("@sha256:")) and (.currentMode | IN("OBSERVE", "GUARDED", "FULL"))' route-completion-rollout-evidence.json

      - name: Upload completion evidence
        uses: actions/upload-artifact@v7
        with:
          name: route-completion-rollout-evidence
          path: route-completion-rollout-evidence.json
          if-no-files-found: error
          retention-days: 14

  alarm_canary:
    needs: route
    if: needs.route.outputs.operation == 'alarm_canary'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Validate alarm canary inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Require source on main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROUTE_OPS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Exercise alarm actions and require subscriber receipts
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          OBSERVE_ALARM: ${{ vars.ROUTE_COMPLETION_ALARM_NAME }}
          RECEIPT_TOKEN: ${{ secrets.ROUTE_COMPLETION_ALARM_CANARY_RECEIPT_TOKEN }}
          RECEIPT_URL: ${{ vars.ROUTE_COMPLETION_ALARM_CANARY_RECEIPT_URL }}
          REJECT_ALARM: ${{ vars.ROUTE_COMPLETION_REJECT_ALARM_NAME }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TOPIC_ARN: ${{ vars.ROUTE_COMPLETION_ALARM_TOPIC_ARN }}
        run: |
          set -euo pipefail
          : "${OBSERVE_ALARM:?}" "${RECEIPT_TOKEN:?}" "${RECEIPT_URL:?}" "${REJECT_ALARM:?}" "${TOPIC_ARN:?}"
          tmp_dir="$(mktemp -d)"
          trap 'aws cloudwatch set-alarm-state --region "$AWS_REGION" --alarm-name "$OBSERVE_ALARM" --state-value INSUFFICIENT_DATA --state-reason "canary complete" >/dev/null 2>&1 || true; aws cloudwatch set-alarm-state --region "$AWS_REGION" --alarm-name "$REJECT_ALARM" --state-value INSUFFICIENT_DATA --state-reason "canary complete" >/dev/null 2>&1 || true; rm -rf "$tmp_dir"' EXIT
          exercise() {
            alarm_name="$1" metric_name="$2" token="${SOURCE_SHA}:$(cat /proc/sys/kernel/random/uuid)"
            aws cloudwatch set-alarm-state --region "$AWS_REGION" --alarm-name "$alarm_name" --state-value INSUFFICIENT_DATA --state-reason "prepare approved route completion canary $token"
            aws cloudwatch set-alarm-state --region "$AWS_REGION" --alarm-name "$alarm_name" --state-value ALARM --state-reason "approved route completion canary $token" --state-reason-data "{\"correlationToken\":\"$token\",\"sourceSha\":\"$SOURCE_SHA\"}"
            for attempt in $(seq 1 18); do
              if curl -fsS --get -H "Authorization: Bearer $RECEIPT_TOKEN" --data-urlencode "correlationToken=$token" "$RECEIPT_URL" > "$tmp_dir/receipt.json" \
                && jq -e --arg alarm "$alarm_name" --arg metric "$metric_name" --arg sha "$SOURCE_SHA" --arg token "$token" --arg topic "$TOPIC_ARN" '.alarmName == $alarm and .metricName == $metric and .sourceSha == $sha and .correlationToken == $token and .topicArn == $topic and .deliveryStatus == "DELIVERED"' "$tmp_dir/receipt.json" >/dev/null; then
                jq -c '{alarmName, correlationToken, deliveryStatus, metricName, receivedAt}' "$tmp_dir/receipt.json"
                return 0
              fi
              test "$attempt" -lt 18 || return 1
              sleep 5
            done
          }
          exercise "$OBSERVE_ALARM" DriverRouteCompletionWouldReject > "$tmp_dir/observe.json"
          exercise "$REJECT_ALARM" DriverRouteCompletionRejected > "$tmp_dir/reject.json"
          jq -n --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg sha "$SOURCE_SHA" --arg topic "$TOPIC_ARN" --slurpfile observe "$tmp_dir/observe.json" --slurpfile reject "$tmp_dir/reject.json" '{schemaVersion:1, sourceSha:$sha, topicArn:$topic, generatedAt:$generatedAt, deliveries:($observe + $reject)}' > route-completion-alarm-canary-receipt.json

      - name: Upload alarm canary receipts
        uses: actions/upload-artifact@v7
        with:
          name: route-completion-alarm-canary-receipt
          path: route-completion-alarm-canary-receipt.json
          if-no-files-found: error
          retention-days: 1

  invariant_mode:
    needs: route
    if: needs.route.outputs.operation == 'invariant_mode'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Validate invariant operation inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Require source on main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require exact successful main SHA for invariant elevation
        if: inputs.target_mode != 'OBSERVE'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$SOURCE_SHA&per_page=1" --jq '.total_count')" -gt 0

      - name: Validate invariant mode wrapper
        run: |
          chmod +x scripts/ssm-route-completion-invariant-mode.sh scripts/verify-route-completion-alarm.sh tests/deploy/route-completion-invariant-rollout.test.sh
          tests/deploy/route-completion-invariant-rollout.test.sh

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROUTE_OPS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - name: Verify completion evidence provenance
        if: inputs.target_mode != 'OBSERVE'
        id: evidence
        env:
          ARTIFACT_ID: ${{ inputs.evidence_artifact_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_MODE: ${{ inputs.target_mode }}
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r '.expired' <<<"$artifact")" = false
          test "$(jq -r '.name' <<<"$artifact")" = route-completion-rollout-evidence
          run_id="$(jq -r '.workflow_run.id' <<<"$artifact")"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "$SOURCE_SHA"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.path' <<<"$run")" = .github/workflows/route-ops-operations.yml
          jq -e '.display_title | startswith("Route Ops / completion_evidence /")' <<<"$run"
          mkdir evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
          test "$(find evidence -type f -name route-completion-rollout-evidence.json | wc -l | tr -d ' ')" = 1
          evidence_path="$(find evidence -type f -name route-completion-rollout-evidence.json)"
          current_mode="$(jq -er '.currentMode' "$evidence_path")"
          node scripts/validate-route-completion-rollout-evidence.mjs "$evidence_path" "$SOURCE_SHA" "$current_mode" "$TARGET_MODE"
          {
            echo "current_mode=$current_mode"
            echo "image_id=$(jq -er '.runtime.imageId' "$evidence_path")"
            echo "image_repo_digest=$(jq -er '.runtime.imageRepoDigest' "$evidence_path")"
          } >> "$GITHUB_OUTPUT"

      - name: Require elevated emergency rollback approval
        if: inputs.target_mode == 'OBSERVE'
        env:
          EMERGENCY_ALLOWED_ACTORS: ${{ vars.ROUTE_COMPLETION_EMERGENCY_ROLLBACK_ALLOWED_ACTORS }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          case ",${EMERGENCY_ALLOWED_ACTORS// /}," in *",$GITHUB_ACTOR_NAME,"*) ;; *) exit 1 ;; esac

      - name: Verify alarm canary provenance
        if: inputs.target_mode != 'OBSERVE'
        env:
          ARTIFACT_ID: ${{ inputs.alarm_receipt_artifact_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r '.expired' <<<"$artifact")" = false
          test "$(jq -r '.name' <<<"$artifact")" = route-completion-alarm-canary-receipt
          run_id="$(jq -r '.workflow_run.id' <<<"$artifact")"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "$SOURCE_SHA"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.event' <<<"$run")" = workflow_dispatch
          test "$(jq -r '.path' <<<"$run")" = .github/workflows/route-ops-operations.yml
          jq -e '.display_title | startswith("Route Ops / alarm_canary /")' <<<"$run"
          mkdir alarm-receipt
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > alarm-receipt.zip
          unzip -q alarm-receipt.zip -d alarm-receipt
          test "$(find alarm-receipt -type f -name route-completion-alarm-canary-receipt.json | wc -l | tr -d ' ')" = 1

      - name: Change invariant mode through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
          ROUTE_COMPLETION_SOURCE_SHA: ${{ inputs.source_sha }}
          ROUTE_COMPLETION_EXPECTED_IMAGE_ID: ${{ steps.evidence.outputs.image_id }}
          ROUTE_COMPLETION_EXPECTED_IMAGE_REPO_DIGEST: ${{ steps.evidence.outputs.image_repo_digest }}
          ROUTE_COMPLETION_EXPECTED_CURRENT_MODE: ${{ steps.evidence.outputs.current_mode }}
          ROUTE_COMPLETION_EMERGENCY_ROLLBACK: ${{ inputs.target_mode == 'OBSERVE' && 'true' || 'false' }}
          ROUTE_COMPLETION_TARGET_MODE: ${{ inputs.target_mode }}
          ROUTE_OPS_SSM_TAG_KEY: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_KEY || 'Service' }}
          ROUTE_OPS_SSM_TAG_VALUE: ${{ vars.SSM_ROUTE_OPS_TARGET_TAG_VALUE || 'clever-delivery-server' }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.target_mode }}' != OBSERVE ]; then
            ROUTE_COMPLETION_OBSERVE_ALARM_NAME='${{ vars.ROUTE_COMPLETION_ALARM_NAME }}' \
            ROUTE_COMPLETION_REJECT_ALARM_NAME='${{ vars.ROUTE_COMPLETION_REJECT_ALARM_NAME }}' \
            ROUTE_COMPLETION_ALARM_TOPIC_ARN='${{ vars.ROUTE_COMPLETION_ALARM_TOPIC_ARN }}' \
            ROUTE_COMPLETION_ALARM_RECEIPT_PATH="$(find alarm-receipt -type f -name route-completion-alarm-canary-receipt.json)" \
              scripts/verify-route-completion-alarm.sh
          fi
          scripts/ssm-route-completion-invariant-mode.sh

  summary:
    if: always()
    needs: [route, deploy, edge_caddy, backup_setup, docker_cleanup, completion_evidence, alarm_canary, invariant_mode]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize operation graph
        run: |
          {
            echo "### Route Ops operation graph"
            echo "- operation: ${{ inputs.operation }}"
            echo "- selected branch: ${{ needs.route.outputs.operation }}"
            echo "- deploy: ${{ needs.deploy.result }}"
            echo "- edge_caddy: ${{ needs.edge_caddy.result }}"
            echo "- backup_setup: ${{ needs.backup_setup.result }}"
            echo "- docker_cleanup: ${{ needs.docker_cleanup.result }}"
            echo "- completion_evidence: ${{ needs.completion_evidence.result }}"
            echo "- alarm_canary: ${{ needs.alarm_canary.result }}"
            echo "- invariant_mode: ${{ needs.invariant_mode.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
