name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deliverables/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# classify selects lanes from the changed files. Independent lanes run in
# parallel. validate is the single verdict: every selected lane must succeed
# and every unselected lane must be skipped. Deploys consume this exact-SHA
# workflow result and never repeat CI-grade tests.
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed_files_count: ${{ steps.classify.outputs.changed_files_count }}
      web_changed: ${{ steps.classify.outputs.web_changed }}
      api_changed: ${{ steps.classify.outputs.api_changed }}
      customer_email_changed: ${{ steps.classify.outputs.customer_email_changed }}
      deploy_changed: ${{ steps.classify.outputs.deploy_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      critical_changed: ${{ steps.classify.outputs.critical_changed }}
      full_required: ${{ steps.classify.outputs.full_required }}
      dependency_changed: ${{ steps.classify.outputs.dependency_changed }}
      web_artifact_required: ${{ steps.classify.outputs.web_artifact_required }}
      api_test_profile: ${{ steps.classify.outputs.api_test_profile }}
      run_api_static: ${{ steps.classify.outputs.run_api_static }}
      run_api_db: ${{ steps.classify.outputs.run_api_db }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Detect changed files
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${before}^{commit}" 2>/dev/null; then
                git -c core.quotePath=false diff --name-only "$before" "$GITHUB_SHA" > changed-files.txt
              else
                git -c core.quotePath=false ls-files > changed-files.txt
              fi
              ;;
            pull_request)
              git fetch --no-tags origin "${{ github.base_ref }}"
              base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
              git -c core.quotePath=false diff --name-only "$base" HEAD > changed-files.txt
              ;;
            *)
              git -c core.quotePath=false ls-files > changed-files.txt
              ;;
          esac
          cat changed-files.txt

      - name: Classify validation profile
        id: classify
        shell: bash
        env:
          FULL_VERIFY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          if [ "$FULL_VERIFY" = "true" ]; then args+=(--full-verify); fi
          node scripts/ci/route-ops-change-classifier.mjs "${args[@]}" < changed-files.txt
          cat "$GITHUB_OUTPUT"

  checks:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/delivery-api/package-lock.json
            apps/route-ops-web/package-lock.json

      - name: Repository hygiene
        run: |
          node scripts/check-ignore-hygiene.mjs
          scripts/scan-secrets.sh --worktree
          tests/security/scan-secrets.test.sh

      - name: Workflow and classifier contracts
        if: needs.classify.outputs.workflow_changed == 'true' || needs.classify.outputs.full_required == 'true'
        run: |
          node tests/ci/github-actions-structure.test.mjs
          node tests/ci/route-ops-change-classifier.test.mjs

      - name: Release wrapper contracts
        if: needs.classify.outputs.deploy_changed == 'true' || needs.classify.outputs.workflow_changed == 'true' || needs.classify.outputs.full_required == 'true'
        run: |
          for script in \
            scripts/ssm-simple-route-ops-deploy.sh \
            scripts/ssm-edge-caddy-deploy.sh \
            scripts/backup-route-ops-data.sh \
            scripts/ssm-install-route-ops-backup.sh \
            scripts/route-ops-docker-cleanup.sh \
            scripts/ssm-route-ops-docker-cleanup.sh \
            scripts/ssm-route-completion-invariant-mode.sh \
            scripts/verify-route-completion-alarm.sh \
            scripts/osrm-ontario.sh \
            scripts/monitor-route-ops-production.sh \
            scripts/route-tracking-preservation-worker.sh \
            apps/delivery-api/scripts/guard-prisma-db-push.sh \
            apps/delivery-api/scripts/dsv-g007-migrate-deploy.sh \
            apps/delivery-api/scripts/dsv-g007-rehearsal.sh; do
            bash -n "$script"
          done
          tests/deploy/route-ops-prisma-db-push-guard.test.sh
          tests/deploy/route-ops-prisma-migrate-deploy.test.sh
          tests/deploy/dsv-g007-rehearsal.test.sh
          tests/deploy/ssm-simple-route-ops-deploy.test.sh
          tests/deploy/ssm-edge-caddy-deploy.test.sh
          tests/deploy/route-ops-backup.test.sh
          tests/deploy/route-ops-docker-cleanup.test.sh
          tests/deploy/route-completion-invariant-rollout.test.sh
          tests/deploy/monitor-route-ops-production.test.sh
          tests/deploy/route-ops-retention-runtime.test.sh
          apps/delivery-api/tests/deploy/driver-event-attempt-retention-schedule.test.sh
          OSRM_DRY_RUN=1 scripts/osrm-ontario.sh preflight
          OSRM_DRY_RUN=1 scripts/osrm-ontario.sh prepare
          OSRM_DRY_RUN=1 scripts/osrm-ontario.sh smoke

      - name: Install Route Ops Web dependencies
        if: >-
          needs.classify.outputs.full_required == 'true' ||
          needs.classify.outputs.web_changed == 'true' ||
          (needs.classify.outputs.api_changed == 'true' && needs.classify.outputs.web_artifact_required == 'true')
        run: npm --prefix apps/route-ops-web ci --no-audit --no-fund

      - name: Validate Route Ops Web
        if: >-
          needs.classify.outputs.full_required == 'true' ||
          needs.classify.outputs.web_changed == 'true'
        run: |
          npm --prefix apps/route-ops-web run lint
          npm --prefix apps/route-ops-web run typecheck
          npm --prefix apps/route-ops-web run test

      - name: Build Route Ops Web artifact for API tests
        if: >-
          needs.classify.outputs.full_required == 'true' ||
          needs.classify.outputs.web_changed == 'true' ||
          (needs.classify.outputs.api_changed == 'true' && needs.classify.outputs.web_artifact_required == 'true')
        run: npm --prefix apps/route-ops-web run build

      - name: Install delivery API dependencies
        if: needs.classify.outputs.run_api_static == 'true'
        run: npm --prefix apps/delivery-api ci --no-audit --no-fund

      - name: Dependency security audit
        if: needs.classify.outputs.dependency_changed == 'true'
        run: npm --prefix apps/delivery-api run audit:production

      - name: Generate Prisma client for API tests
        if: needs.classify.outputs.run_api_static == 'true'
        run: npm --prefix apps/delivery-api run prisma:generate

      - name: Route geometry test profile
        if: >-
          needs.classify.outputs.api_changed == 'true' &&
          needs.classify.outputs.api_test_profile == 'route_geometry' &&
          needs.classify.outputs.full_required != 'true'
        run: >
          npm --prefix apps/delivery-api run test --
          tests/osrm-route-geometry.client.test.ts
          tests/route-plan-geometry-cache.test.ts
          tests/refresh-route-geometry-cache.script.test.ts
          tests/route-plan.service.test.ts
          tests/route-plan.repository.test.ts

      - name: Delivery API test profile
        if: >-
          needs.classify.outputs.full_required == 'true' ||
          (needs.classify.outputs.api_changed == 'true' &&
           needs.classify.outputs.api_test_profile != 'route_geometry')
        run: npm --prefix apps/delivery-api run test

      - name: Compose config
        if: >-
          needs.classify.outputs.full_required == 'true' ||
          needs.classify.outputs.deploy_changed == 'true' ||
          (needs.classify.outputs.api_changed == 'true' && needs.classify.outputs.critical_changed == 'true')
        run: |
          cp apps/delivery-api/.env.example apps/delivery-api/.env
          npm run compose:config
          rm -f apps/delivery-api/.env

  # Typed ESLint is the slowest static check, so it gets its own runner.
  api_lint:
    needs: classify
    if: needs.classify.outputs.run_api_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/delivery-api/package-lock.json

      - name: Install delivery API dependencies
        run: npm --prefix apps/delivery-api ci --no-audit --no-fund

      - name: Lint delivery API
        run: |
          npm --prefix apps/delivery-api run prisma:generate
          npm --prefix apps/delivery-api run lint

  api_static:
    needs: classify
    if: needs.classify.outputs.run_api_static == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/delivery-api/package-lock.json

      - name: Install delivery API dependencies
        run: npm --prefix apps/delivery-api ci --no-audit --no-fund

      - name: Prepare delivery API
        run: |
          npm --prefix apps/delivery-api run prisma:generate
          npm --prefix apps/delivery-api run typecheck

      - name: Build delivery API once
        run: npm --prefix apps/delivery-api run build

      # Smokes the compiled dist CLI, so it must follow the build in this lane.
      - name: Customer email reconciliation wrapper
        if: >-
          needs.classify.outputs.customer_email_changed == 'true' ||
          needs.classify.outputs.full_required == 'true'
        run: tests/deploy/ssm-customer-email-reconciliation.test.sh

  # Two runners split the disposable PostgreSQL profile. Each shard keeps the
  # serial test order it had inside the single script.
  api_db:
    needs: classify
    if: needs.classify.outputs.run_api_db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [core, isolated]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/delivery-api/package-lock.json

      - name: Install delivery API dependencies
        run: npm --prefix apps/delivery-api ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm --prefix apps/delivery-api run prisma:generate

      - name: Disposable PostgreSQL test profile
        env:
          CLEVER_RUN_DISPOSABLE_DB_TESTS: "1"
          CLEVER_DISPOSABLE_DB_SHARD: ${{ matrix.shard }}
        run: |
          npm --prefix apps/delivery-api run test:db:disposable
          if [ "$CLEVER_DISPOSABLE_DB_SHARD" = isolated ]; then
            bash apps/delivery-api/scripts/test-original-observations-db.sh
          fi

  validate:
    # Runs after failed or timed-out lanes. A cancelled run is never a
    # successful run, so the deploy gate still refuses it.
    if: ${{ !cancelled() }}
    needs: [classify, checks, api_lint, api_static, api_db]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected lane to pass
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          API_LINT_RESULT: ${{ needs.api_lint.result }}
          API_STATIC_RESULT: ${{ needs.api_static.result }}
          API_DB_RESULT: ${{ needs.api_db.result }}
          RUN_API_STATIC: ${{ needs.classify.outputs.run_api_static }}
          RUN_API_DB: ${{ needs.classify.outputs.run_api_db }}
        run: |
          set -euo pipefail
          failed=0
          expect() {
            local lane="$1" result="$2" selected="$3" want=skipped
            if [ "$selected" = true ]; then want=success; fi
            printf '%s: %s (expected %s)\n' "$lane" "$result" "$want"
            if [ "$result" != "$want" ]; then
              echo "::error::$lane finished as $result; expected $want"
              failed=1
            fi
          }
          expect classify "$CLASSIFY_RESULT" true
          expect checks "$CHECKS_RESULT" true
          expect api_lint "$API_LINT_RESULT" "$RUN_API_STATIC"
          expect api_static "$API_STATIC_RESULT" "$RUN_API_STATIC"
          expect api_db "$API_DB_RESULT" "$RUN_API_DB"
          exit "$failed"

      - name: Validation summary
        if: always()
        run: |
          {
            echo "### CI profile"
            echo "- changed files: ${{ needs.classify.outputs.changed_files_count }}"
            echo "- web: ${{ needs.classify.outputs.web_changed }}"
            echo "- api: ${{ needs.classify.outputs.api_changed }}"
            echo "- customer email: ${{ needs.classify.outputs.customer_email_changed }}"
            echo "- deploy: ${{ needs.classify.outputs.deploy_changed }}"
            echo "- full: ${{ needs.classify.outputs.full_required }}"
            echo "- API tests: ${{ needs.classify.outputs.api_test_profile }}"
            echo "- lanes: checks=${{ needs.checks.result }} api_lint=${{ needs.api_lint.result }} api_static=${{ needs.api_static.result }} api_db=${{ needs.api_db.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
