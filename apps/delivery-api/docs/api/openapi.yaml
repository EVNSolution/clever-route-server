        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    DsvSessionCookie:
      type: apiKey
      in: cookie
      name: clever_dsv_admin
      description: Shop-scoped HTTP-only DSV operator session cookie.
    DsvCsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token issued with the shop-scoped DSV operator session.
    ShopifySessionToken:
      type: http
      scheme: bearer
      bearerFormat: Shopify App Bridge session JWT
      description: Server-verified Shopify embedded app session token.
    DriverAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-issued short-lived account/route JWT with audience clever-delivery-driver-route.
    DriverAccountAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-issued short-lived phone-account JWT with audience clever-driver-account.
    ShopifyWebhookHmac:
      type: apiKey
      in: header
      name: X-Shopify-Hmac-Sha256
      description: Base64 HMAC generated by Shopify over the raw request body.
  parameters:
    AdminUiCsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Same-origin admin UI CSRF token issued in the authenticated browser session.
    RouteOpsShopDomainQuery:
      name: shopDomain
      in: query
      required: false
      schema:
        type: string
      description: Required when the admin UI session is not already scoped to one WordPress/Woo shop domain.
    DsvV1ServiceDateQuery:
      name: serviceDate
      in: query
      required: false
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Optional service date. Runtime rejects non-YYYY-MM-DD values.
    DsvV1CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Opaque pagination cursor. Runtime rejects blank or repeated cursor parameters.
    DsvV1LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Optional page size. Runtime defaults to 50 and rejects non-integer, blank, repeated, or out-of-range values.
    DsvV1WindowQuery:
      name: window
      in: query
      required: false
      schema:
        type: string
        enum: [today, tomorrow, day-after-tomorrow]
      description: Customer delivery date window resolved in the tenant timezone.
    DsvV1SellerOrderIdPath:
      name: sellerOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Canonical seller-order identifier.
    DsvV1AssignmentIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
        pattern: '\S'
      description: >-
        Client command identifier. Required when commandId is omitted from the request body;
        when both values are supplied they must match after runtime trimming.
    RoutePlanId:
      name: routePlanId
      in: path
      required: true
      schema:
        type: string
    DeliveryStopId:
      name: deliveryStopId
      in: path
      required: true
      schema:
        type: string
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
    ShopifyTopicHeader:
      name: X-Shopify-Topic
      in: header
      required: true
      schema:
        type: string
      example: orders/create
    ShopifyShopDomainHeader:
      name: X-Shopify-Shop-Domain
      in: header
      required: true
      schema:
        pattern: '^[a-z0-9][a-z0-9-]*\.myshopify\.com$'
        type: string
      example: example.myshopify.com
    ShopifyWebhookIdHeader:
      name: X-Shopify-Webhook-Id
      in: header
      required: true
      schema:
        type: string
    ShopifyApiVersionHeader:
      name: X-Shopify-API-Version
      in: header
      required: false
      schema:
        type: string
      example: 2026-04
    ShopifyEventIdHeader:
      name: X-Shopify-Event-Id
      in: header
      required: false
      schema:
        type: string
    ShopifyTriggeredAtHeader:
      name: X-Shopify-Triggered-At
      in: header
      required: false
      schema:
        format: date-time
        type: string
  responses:
    BadRequest:
      description: Invalid request payload, query, path, or headers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid bearer token or HMAC.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller is outside the requested shop/driver/route scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Requested resource was not found under the authenticated boundary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Request conflicts with existing route/order assignment state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DsvSchemaNotReady:
      description: A required DSV schema migration has not been applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DsvV1BadRequest:
      description: Unsupported or invalid DSV v1 query parameter or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
    DsvV1Unauthenticated:
      description: Missing or invalid DSV v1 browser session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
    DsvV1Forbidden:
      description: Authenticated principal lacks the required DSV v1 scope or principal type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
    DsvV1DependencyUnavailable:
      description: DSV v1 read dependency is unavailable or not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
    DsvV1SuccessEnvelope:
      type: object
      required: [data, meta, requestId]
      properties:
        data: true
        meta:
          type: object
          required: [apiVersion]
          properties:
            apiVersion:
              type: string
              const: dsv.v1
          additionalProperties: false
        requestId:
          type: string
      additionalProperties: false
    DsvV1ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/DsvV1ErrorCode'
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
      additionalProperties: false
    DsvV1ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - SELLER_ORDER_ALREADY_ACQUIRED
        - COMMAND_IN_PROGRESS
        - IDEMPOTENCY_PAYLOAD_MISMATCH
        - VALIDATION_FAILED
        - DEPENDENCY_UNAVAILABLE
    DsvV1PrincipalType:
      type: string
      enum: [DSV_ADMIN, CUSTOMER_USER, DRIVER, IMPORT_WORKER, DEVICE]
    DsvV1Scope:
      type: string
      enum:
        - dsv:session:read
        - dsv:customers:read
        - dsv:customers:write
        - dsv:destinations:read
        - dsv:destinations:write
        - dsv:resources:read
        - dsv:resources:write
        - dsv:conditions:read
        - dsv:conditions:write
        - dsv:imports:read
        - dsv:imports:write
        - dsv:imports:apply
        - dsv:dispatches:read
        - dsv:dispatches:write
        - dsv:control:read
        - dsv:records:read
        - dsv:settings:read
        - dsv:settings:write
        - dsv:customer-deliveries:read
        - driver:assignments:read
        - driver:assignments:release
        - driver:assignments:acquire
        - driver:events:write
        - driver:proofs:write
        - device:telemetry:write
    DsvV1Session:
      type: object
      required: [principalType, scopes, shopId]
      properties:
        customerId:
          type: string
        driverId:
          type: string
        principalType:
          $ref: '#/components/schemas/DsvV1PrincipalType'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1Scope'
        shopId:
          type: string
      additionalProperties: false
    DsvV1SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1Session'
    DsvV1CommandAcceptedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [ok]
              properties:
                ok:
                  type: boolean
                  const: true
              additionalProperties: false
    DsvV1UnassignCommandInput:
      type: object
      required: [expectedVersion]
      properties:
        commandId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
          description: Required when the Idempotency-Key header is omitted.
        expectedVersion:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '\S'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
      additionalProperties: false
    DsvV1ReassignCommandInput:
      type: object
      required: [expectedVersion, targetDriverId]
      properties:
        commandId:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
          description: Required when the Idempotency-Key header is omitted.
        expectedVersion:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '\S'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
        targetDriverId:
          type: string
          format: uuid
        targetRoutePlanId:
          type: string
          format: uuid
        targetSequence:
          type: integer
          minimum: 0
          description: Zero-based insertion index; runtime converts it to the service's one-based sequence.
        targetVehicleId:
          type: string
          format: uuid
          description: Required when assignment policy cannot derive a target vehicle.
      additionalProperties: false
    DsvV1AssignmentResult:
      type: object
      required:
        - assignmentStatus
        - auditEventId
        - commandId
        - etaStatus
        - newRouteVersionId
        - previousRouteVersionId
        - receiptId
        - routePlanId
        - sellerOrderId
      properties:
        assignmentStatus:
          type: string
          enum: [UNASSIGNED, ASSIGNED]
        auditEventId:
          type: string
        commandId:
          type: string
        etaStatus:
          type: string
          enum: [FAILED, NOT_REQUIRED, PENDING]
        newRouteVersionId:
          type: string
        previousRouteVersionId:
          type: [string, 'null']
        receiptId:
          type: string
        routePlanId:
          type: [string, 'null']
        sellerOrderId:
          type: string
      additionalProperties: false
    DsvV1LegacyAssignmentCommandEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [assignmentResult]
          properties:
            assignmentResult:
              $ref: '#/components/schemas/DsvV1AssignmentResult'
          additionalProperties: false
        error:
          type: 'null'
      additionalProperties: false
    DsvV1LegacyAssignmentErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - DSV_FORBIDDEN
                - NOT_FOUND
                - COMMAND_IN_PROGRESS
                - DUPLICATE_ACTIVE_DELIVERY
                - IDEMPOTENCY_PAYLOAD_MISMATCH
                - SELLER_ORDER_ALREADY_ACQUIRED
                - SELLER_ORDER_ASSIGNMENT_CHANGED
                - SELLER_ORDER_ASSIGNMENT_NOT_READY
                - SELLER_ORDER_ROUTE_RECALCULATION_FAILED
                - SELLER_ORDER_ROUTE_RECALCULATION_UNAVAILABLE
                - SELLER_ORDER_TARGET_VEHICLE_REQUIRED
                - SELLER_ORDER_TRANSFER_CLOSED
                - DSV_ASSIGNMENT_SERVICE_UNAVAILABLE
                - DSV_SCHEMA_NOT_READY
                - DSV_REQUEST_FAILED
            details:
              type: object
              additionalProperties: true
            message:
              type: string
          additionalProperties: false
      additionalProperties: false
    DsvV1EtaStatus:
      type: string
      enum: [NOT_REQUIRED, PENDING, READY, FAILED, STALE]
    DsvV1ProofStatus:
      type: string
      enum: [NONE, AVAILABLE, EXPIRED]
    DsvV1PageInfo:
      type: object
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: string
      additionalProperties: false
    DsvV1SellerOrderSummary:
      type: object
      required: [assignmentStatus, customerId, destinationId, etaStatus, sellerOrderId, sellerOrderKey]
      properties:
        assignmentStatus:
          type: string
          enum: [UNASSIGNED, ASSIGNED]
        customerId:
          type: string
        destinationId:
          type: string
        estimatedArrivalAt:
          type: string
          format: date-time
        etaStatus:
          $ref: '#/components/schemas/DsvV1EtaStatus'
        routePlanId:
          type: string
        routeVersionId:
          type: string
        sellerOrderId:
          type: string
        sellerOrderKey:
          type: string
      additionalProperties: false
    DsvV1SellerOrderSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1SellerOrderSummary'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1SellerOrderSummaryPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1SellerOrderSummaryPage'
    DsvV1ControlSummary:
      type: object
      required:
        - assignedCount
        - failedEtaCount
        - pendingEtaCount
        - readyEtaCount
        - serviceDate
        - totalDispatchCount
        - unassignedCount
      properties:
        assignedCount:
          type: integer
          minimum: 0
        failedEtaCount:
          type: integer
          minimum: 0
        pendingEtaCount:
          type: integer
          minimum: 0
        readyEtaCount:
          type: integer
          minimum: 0
        serviceDate:
          type: string
          format: date
        totalDispatchCount:
          type: integer
          minimum: 0
        unassignedCount:
          type: integer
          minimum: 0
      additionalProperties: false
    DsvV1ControlSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1ControlSummary'
    DsvV1EventSummary:
      type: object
      required: [occurredAt, type]
      properties:
        occurredAt:
          type: string
          format: date-time
        type:
          type: string
      additionalProperties: false
    DsvV1Record:
      type: object
      required: [deliveryStatus, destinationDisplayName, etaStatus, eventSummary, proofStatus, sellerOrderKey]
      properties:
        deliveryStatus:
          type: string
        destinationDisplayName:
          type: string
        estimatedArrivalAt:
          type: string
          format: date-time
        etaStatus:
          $ref: '#/components/schemas/DsvV1EtaStatus'
        eventSummary:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1EventSummary'
        proofStatus:
          $ref: '#/components/schemas/DsvV1ProofStatus'
        sellerOrderKey:
          type: string
      additionalProperties: false
    DsvV1RecordPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1Record'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1RecordPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1RecordPage'
    DsvV1DriverListItem:
      type: object
      required: [displayName, driverId]
      properties:
        displayName:
          type: string
        driverId:
          type: string
        phone:
          type: string
        status:
          type: string
      additionalProperties: false
    DsvV1VehicleListItem:
      type: object
      required: [displayName, driverAssignments, vehicleId]
      properties:
        displayName:
          type: string
        driverAssignments:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1VehicleDriverAssignmentListItem'
        status:
          type: string
        vehicleId:
          type: string
        vehiclePlate:
          type: string
      additionalProperties: false
    DsvV1VehicleDriverAssignmentListItem:
      type: object
      required: [assignmentId, driverId]
      properties:
        assignmentId:
          type: string
        driverId:
          type: string
      additionalProperties: false
    DsvV1CustomerListItem:
      type: object
      required: [customerId, displayName]
      properties:
        customerId:
          type: string
        displayName:
          type: string
        externalCustomerCode:
          type: string
        status:
          type: string
      additionalProperties: false
    DsvV1DestinationListItem:
      type: object
      required: [destinationId, displayName]
      properties:
        address:
          type: string
        destinationId:
          type: string
        displayName:
          type: string
      additionalProperties: false
    DsvV1ConditionListItem:
      type: object
      required: [conditionId, name]
      properties:
        conditionId:
          type: string
        name:
          type: string
        status:
          type: string
      additionalProperties: false
    DsvV1DriverListPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1DriverListItem'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1VehicleListPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1VehicleListItem'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1CustomerListPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1CustomerListItem'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1DestinationListPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1DestinationListItem'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1ConditionListPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1ConditionListItem'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1DriverListEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1DriverListPage'
    DsvV1VehicleListEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1VehicleListPage'
    DsvV1CustomerListEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1CustomerListPage'
    DsvV1DestinationListEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1DestinationListPage'
    DsvV1ConditionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1ConditionListPage'
    DsvV1CustomerDeliveryInquiryItem:
      type: object
      required: [deliveryStatus, destinationDisplayName, etaStatus, eventSummary, proofStatus, sellerOrderKey]
      properties:
        deliveryStatus:
          type: string
        destinationDisplayName:
          type: string
        estimatedArrivalAt:
          type: string
          format: date-time
        etaStatus:
          $ref: '#/components/schemas/DsvV1EtaStatus'
        eventSummary:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1EventSummary'
        proofStatus:
          $ref: '#/components/schemas/DsvV1ProofStatus'
        sellerOrderKey:
          type: string
      additionalProperties: false
    DsvV1CustomerDeliveryInquiryPage:
      type: object
      required: [items]
      properties:
        emptyReason:
          type: string
          enum: [DATE_OUT_OF_WINDOW, NO_ACTIVE_CUSTOMER_SCOPE, NO_DELIVERIES, NO_SERVICE_DATE]
        items:
          type: array
          items:
            $ref: '#/components/schemas/DsvV1CustomerDeliveryInquiryItem'
        page:
          $ref: '#/components/schemas/DsvV1PageInfo'
      additionalProperties: false
    DsvV1CustomerDeliveryInquiryEnvelope:
      allOf:
        - $ref: '#/components/schemas/DsvV1SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/DsvV1CustomerDeliveryInquiryPage'
    DsvOperationSettingsEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [loadingStartTime, plannedDepartureTime]
          properties:
            loadingStartTime:
              type: [string, 'null']
              pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
            plannedDepartureTime:
              type: [string, 'null']
              pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$'
        error: { type: 'null' }
    DsvDriver:
      allOf:
        - $ref: '#/components/schemas/DsvDriverRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    DsvDriverRequest:
      type: object
      additionalProperties: false
      required: [age, career, gender, name, score, traits, zone]
      properties:
        age: { type: integer, minimum: 18, maximum: 100 }
        career: { type: string, minLength: 1, maxLength: 160 }
        gender: { type: string, minLength: 1, maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 80 }
        score: { type: string, minLength: 1, maxLength: 40 }
        traits:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 160 }
        zone: { type: string, minLength: 1, maxLength: 160 }
    DsvVehicle:
      allOf:
        - $ref: '#/components/schemas/DsvVehicleRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    DsvVehicleRequest:
      type: object
      additionalProperties: false
      required: [note, plate, type]
      properties:
        note: { type: string, maxLength: 1000 }
        plate: { type: string, minLength: 1, maxLength: 40 }
        type: { type: string, minLength: 1, maxLength: 160 }
    DsvVehicleDriverAssignment:
      type: object
      additionalProperties: false
      required: [driverId, id, kind, vehicleId]
      properties:
        driverId: { type: string, format: uuid }
        id: { type: string, format: uuid }
        kind: { type: string, enum: ['기본 배정'] }
        vehicleId: { type: string, format: uuid }
    DsvResourceSnapshotEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [assignments, drivers, vehicles]
          properties:
            assignments:
              type: array
              items: { $ref: '#/components/schemas/DsvVehicleDriverAssignment' }
            drivers:
              type: array
              items: { $ref: '#/components/schemas/DsvDriver' }
            vehicles:
              type: array
              items: { $ref: '#/components/schemas/DsvVehicle' }
        error: { type: 'null' }
    DsvDispatchImportRequest:
      type: object
      additionalProperties: false
      required: [fileName, planDate, rows]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        planDate: { type: string, format: date }
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/DsvDispatchImportRowInput' }
    DsvDispatchImportRowInput:
      type: object
      additionalProperties: false
      required: [rowNumber, driverName, vehiclePlate, destinationName, conditionCode, shippedBoxes, address, customerCode, sellerOrderKey, notes, latitude, longitude]
      properties:
        rowNumber: { type: integer, minimum: 2 }
        driverName: { type: string, maxLength: 80 }
        vehiclePlate: { type: string, maxLength: 40 }
        destinationName: { type: string, maxLength: 160 }
        conditionCode: { type: string, maxLength: 80 }
        shippedBoxes: { type: integer }
        address: { type: string, maxLength: 500 }
        customerCode: { type: string, maxLength: 160 }
        sellerOrderKey: { type: string, maxLength: 160 }
        notes: { type: [string, 'null'], maxLength: 1000 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
    GenericDataEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          additionalProperties: true
        error:
          type: 'null'
    HealthResponse:
      type: object
      required: [service, status]
      properties:
