openapi: 3.1.0
info:
  title: CLEVER Route Server Delivery API
  version: 0.1.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-UNLICENSED
  summary: CLEVER route server delivery API HTTP contract
  description: >-
    Machine-readable contract for CLEVER route server communication with current
    admin clients, legacy Shopify compatibility routes, native driver mobile
    clients, and operational health checks. Human behavior notes live beside
    this file in docs/api/*.md.
  x-contract-revision: 2026-07-31
  x-source-repository: EVNSolution/clever-route-server
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://{deliveryServerHost}
    description: Deployed delivery server
    variables:
      deliveryServerHost:
        default: delivery.example.com
security: []
tags:
  - name: API Documentation
    description: Browser-accessible API docs landing page and raw OpenAPI document
  - name: Health
    description: Operational readiness and liveness probes
  - name: Route Ops Admin UI
    description: Authenticated browser/admin UI APIs protected by same-origin session cookies and CSRF tokens
  - name: DSV Control
    description: DSV operator session, selected delivery context, and reusable destination tips
  - name: DSV API v1
    description: Cookie-authenticated DSV v1 facade served under /api/dsv/v1
  - name: Shopify Embedded Admin
    description: Shopify embedded/admin app calls protected by Shopify session tokens
  - name: Shopify Webhooks
    description: Shopify HTTPS webhook ingress protected by HMAC headers
  - name: Driver Mobile
    description: Native driver app API calls
  - name: Routes App Distribution
    description: Public install redirect and release metadata for CLEVER Routes
paths:
  /docs:
    get:
      tags: [API Documentation]
      summary: Browser API docs landing page for this service contract
      operationId: getApiDocsUi
      x-source-file: src/routes/api-docs.routes.ts
      responses:
        '200':
          description: Minimal HTML page that links to `/docs/openapi.yaml`.
          content:
            text/html:
              schema:
                type: string

  /docs/openapi.yaml:
    get:
      tags: [API Documentation]
      summary: Raw OpenAPI YAML document for this service
      operationId: getOpenApiYaml
      x-source-file: src/routes/api-docs.routes.ts
      responses:
        '200':
          description: OpenAPI YAML contract.
          content:
            application/yaml:
              schema:
                type: string
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealthz
      x-source-file: src/routes/health.routes.ts
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    service: clever-route-server
                    status: ok
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: getReadyz
      x-source-file: src/routes/health.routes.ts
      responses:
        '200':
          description: Service is ready for the current HTTP scaffold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /routes-app:
    get:
      tags: [Routes App Distribution]
      summary: Show the CLEVER Routes Android installation guide
      description: Public, unauthenticated stable install page that hands off to the managed package download.
      operationId: getRoutesAppInstall
      x-source-file: src/routes/admin-commerce-connections-ui.routes.ts
      security: []
      responses:
        '200':
          description: Installation and legacy-app removal guidance.
          headers:
            Cache-Control:
              description: Installation guidance must be revalidated.
              schema:
                type: string
                const: no-store
          content:
            text/html:
              schema:
                type: string
        '404':
          description: The CLEVER Routes download URL is not configured.
          headers:
            Cache-Control:
              description: Prevent clients and intermediaries from caching unavailable state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutesAppInstallUnavailableResponse' }
  /routes-app/download:
    get:
      tags: [Routes App Distribution]
      summary: Download the current CLEVER Routes Android package
      description: Public handoff from the installation guide to the managed binary target.
      operationId: downloadRoutesAppAndroid
      x-source-file: src/routes/admin-commerce-connections-ui.routes.ts
      security: []
      responses:
        '302':
          description: Redirect to the configured Android package target.
          headers:
            Location:
              required: true
              description: Current Android package download URL.
              schema:
                type: string
                format: uri
        '404':
          description: The CLEVER Routes download URL is not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutesAppInstallUnavailableResponse' }
  /driver-app:
    get:
      tags: [Routes App Distribution]
      summary: Show legacy clients the CLEVER Routes reinstall guide
      description: Explains the CLEVER Driver to CLEVER Routes name change and Android package-identity migration before handing off to the managed package download.
      operationId: redirectLegacyDriverAppInstall
      x-source-file: src/routes/admin-commerce-connections-ui.routes.ts
      security: []
      responses:
        '200':
          description: Package-identity migration and legacy-app removal guidance.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            text/html:
              schema:
                type: string
  /driver-app/release/android:
    get:
      tags: [Routes App Distribution]
      summary: Read the CLEVER Routes Android release manifest from a legacy client
      description: Backward-compatible alias for `/routes-app/release/android`.
      operationId: getLegacyDriverAppAndroidRelease
      x-source-file: src/routes/admin-commerce-connections-ui.routes.ts
      security: []
      responses:
        '200':
          description: Current Android release manifest.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutesAppAndroidReleaseEnvelope' }
        '404':
          description: The Android release manifest is not configured or is inconsistent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutesAppReleaseUnavailableEnvelope' }
  /routes-app/release/android:
    get:
      tags: [Routes App Distribution]
      summary: Read the current CLEVER Routes Android release manifest
      description: Public, unauthenticated release metadata. The response exposes the stable server install URL, not the configured package target.
      operationId: getRoutesAppAndroidRelease
      x-source-file: src/routes/admin-commerce-connections-ui.routes.ts
      security: []
      responses:
        '200':
          description: Current Android release manifest.
          headers:
            Cache-Control:
              description: Release metadata must be revalidated on every request.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutesAppAndroidReleaseEnvelope' }
        '404':
          description: The Android release manifest is not configured or is inconsistent.
          headers:
            Cache-Control:
              description: Prevent clients and intermediaries from caching unavailable state.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutesAppReleaseUnavailableEnvelope' }
  /api/dsv/v1/session:
    get:
      tags: [DSV API v1]
      summary: Read the current DSV v1 browser session principal
      operationId: getDsvV1Session
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:session:read']
      security: [{ DsvSessionCookie: [] }]
      responses:
        '200':
          description: Current DSV v1 session principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1SessionEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/session/logout:
    post:
      tags: [DSV API v1]
      summary: End the current DSV v1 browser session
      description: No query parameters are supported. Runtime accepts an omitted or empty JSON object body and rejects non-empty request bodies.
      operationId: logoutDsvV1Session
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:session:read']
      security: [{ DsvSessionCookie: [], DsvCsrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminUiCsrfTokenHeader'
      responses:
        '200':
          description: Session cookie cleared.
          headers:
            Set-Cookie:
              description: Clears the configured DSV browser session cookie on the /api/dsv/ path.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1CommandAcceptedEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/dispatches:
    get:
      tags: [DSV API v1]
      summary: Read date-scoped dispatch seller-order summaries
      operationId: listDsvV1Dispatches
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:dispatches:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1ServiceDateQuery'
        - $ref: '#/components/parameters/DsvV1OrderNumberQuery'
        - $ref: '#/components/parameters/DsvV1DestinationNameQuery'
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Dispatch summary page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1SellerOrderSummaryPageEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/control:
    get:
      tags: [DSV API v1]
      summary: Read date-scoped DSV control counters
      operationId: getDsvV1ControlSummary
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:control:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1ServiceDateQuery'
      responses:
        '200':
          description: Control summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1ControlSummaryEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/control/routes:
    get:
      tags: [DSV API v1]
      summary: Read date-scoped cached control route geometry
      description: Returns only server-generated route cache state. This read never invokes OSRM or starts route optimization.
      operationId: listDsvV1ControlRoutes
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:control:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1ServiceDateQuery'
      responses:
        '200':
          description: Cached route geometry for the selected service date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1ControlRoutesEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/map/profile:
    get:
      tags: [DSV API v1]
      summary: Read the DSV map provider profile
      description: Returns an env-configured style profile for the DSV web. The API does not proxy, fetch, or sign tiles.
      operationId: getDsvV1MapProfile
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: []
      security: [{ DsvSessionCookie: [] }]
      responses:
        '200':
          description: Configured DSV map profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1MapProfileEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/records:
    get:
      tags: [DSV API v1]
      summary: Read delivery records with event and proof details
      operationId: listDsvV1Records
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:records:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1ServiceDateQuery'
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Delivery record page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1RecordPageEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/drivers:
    get:
      tags: [DSV API v1]
      summary: Read paginated driver resources
      operationId: listDsvV1Drivers
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:resources:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Driver resource page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1DriverListEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/vehicles:
    get:
      tags: [DSV API v1]
      summary: Read paginated vehicle resources
      operationId: listDsvV1Vehicles
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:resources:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Vehicle resource page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1VehicleListEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/customers:
    get:
      tags: [DSV API v1]
      summary: Read paginated customers
      operationId: listDsvV1Customers
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:customers:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Customer page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1CustomerListEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/destinations:
    get:
      tags: [DSV API v1]
      summary: Read paginated destinations
      operationId: listDsvV1Destinations
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:destinations:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Destination page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1DestinationListEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/conditions:
    get:
      tags: [DSV API v1]
      summary: Read paginated transport conditions
      operationId: listDsvV1Conditions
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:conditions:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Transport condition page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1ConditionListEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/customer/deliveries:
    get:
      tags: [DSV API v1]
      summary: Read deliveries for the authenticated customer
      operationId: listDsvV1CustomerDeliveries
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:customer-deliveries:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1WindowQuery'
        - $ref: '#/components/parameters/DsvV1ServiceDateQuery'
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Customer-scoped delivery inquiry page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1CustomerDeliveryInquiryEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/customers/deliveries:
    get:
      tags: [DSV API v1]
      summary: Read one customer's deliveries as a DSV administrator
      operationId: listDsvV1CustomerDeliveriesForAdmin
      x-source-file: src/routes/dsv-v1-read.routes.ts
      x-required-scopes: ['dsv:customers:read', 'dsv:dispatches:read']
      security: [{ DsvSessionCookie: [] }]
      parameters:
        - name: customerId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/DsvV1WindowQuery'
        - $ref: '#/components/parameters/DsvV1ServiceDateQuery'
        - $ref: '#/components/parameters/DsvV1CursorQuery'
        - $ref: '#/components/parameters/DsvV1LimitQuery'
      responses:
        '200':
          description: Administrator read of one customer-scoped delivery inquiry page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1CustomerDeliveryInquiryEnvelope' }
        '400': { $ref: '#/components/responses/DsvV1BadRequest' }
        '401': { $ref: '#/components/responses/DsvV1Unauthenticated' }
        '403': { $ref: '#/components/responses/DsvV1Forbidden' }
        '503': { $ref: '#/components/responses/DsvV1DependencyUnavailable' }
  /api/dsv/v1/seller-orders/{sellerOrderId}/assignment/unassign:
    post:
      tags: [DSV API v1]
      summary: Remove an active operational assignment without deleting or cancelling the order
      description: >-
        Uses the legacy-compatible DSV mutation envelope. Supply a command identifier in
        either the Idempotency-Key header or request body; when both are supplied they must match.
      operationId: unassignDsvV1SellerOrder
      x-source-file: src/routes/dsv-control.routes.ts
      x-required-scopes: ['dsv:dispatches:write']
      security: [{ DsvSessionCookie: [], DsvCsrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/DsvV1SellerOrderIdPath'
        - $ref: '#/components/parameters/DsvV1AssignmentIdempotencyKeyHeader'
        - $ref: '#/components/parameters/AdminUiCsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DsvV1UnassignCommandInput' }
      responses:
        '200':
          description: Assignment command result or idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentCommandEnvelope' }
        '400':
          description: Invalid seller-order UUID, command payload, or mismatched command identifiers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
        '401':
          description: Missing or invalid DSV browser session cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
        '403':
          description: Invalid CSRF token or missing dsv:dispatches:write scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
        '404':
          description: Seller order was not found in the authenticated shop.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
        '409':
          description: Assignment state, transfer policy, or idempotency state conflicts with the command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
        '422':
          description: Seller-order assignment is not ready for the command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
        '500':
          description: Route recalculation or an unexpected DSV request failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
        '503':
          description: Assignment service, route recalculation, or required DSV schema is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DsvV1LegacyAssignmentErrorEnvelope' }
  /api/dsv/v1/seller-order-assignments/reassign:
    post:
      tags: [DSV API v1]
      summary: Move up to 100 seller orders to one driver route atomically
      operationId: batchReassignDsvV1SellerOrders
      x-source-file: src/routes/dsv-control.routes.ts
      x-required-scopes: ['dsv:dispatches:write']
      security: [{ DsvSessionCookie: [], DsvCsrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminUiCsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
