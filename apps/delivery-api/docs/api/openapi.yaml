      required: [appId, devicePushToken, platform]
      properties:
        appId:
          type: string
          minLength: 1
          maxLength: 160
        appVersion:
          type: string
          maxLength: 64
        deviceId:
          type: string
          maxLength: 256
        devicePushToken:
          type: string
          minLength: 1
          maxLength: 4096
        locale:
          type: string
          maxLength: 32
        platform:
          type: string
          enum: [android, ios]
        timezone:
          type: string
          maxLength: 128
      additionalProperties: false
    DriverPushInstallationEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [pushToken]
          properties:
            pushToken:
              type: object
              required: [id, status]
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [ACTIVE]
        error:
          type: 'null'
    DriverPushRevocationEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [revoked]
          properties:
            revoked:
              type: boolean
        error:
          type: 'null'
    DriverRouteAccessEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/DriverInvitedRouteAccess'
            - $ref: '#/components/schemas/DriverRoutesFoundAccess'
            - $ref: '#/components/schemas/DriverMultipleMatchesAccess'
            - $ref: '#/components/schemas/DriverDeniedAccess'
        error:
          type: 'null'
    DriverInvitedRouteAccess:
      type: object
      required: [companyGuidance, driverAccess, routeAccess, status]
      properties:
        status:
          const: INVITED
        routeAccess:
          $ref: '#/components/schemas/DriverRouteAccessContext'
        driverAccess:
          $ref: '#/components/schemas/DriverAccessTokenData'
        companyGuidance:
          $ref: '#/components/schemas/DriverCompanyGuidance'
    DriverRoutesFoundAccess:
      type: object
      required: [routes, status]
      properties:
        status:
          const: ROUTES_FOUND
        routes:
          type: array
          items:
            type: object
            required: [companyGuidance, driverAccess, routeAccess]
            properties:
              routeAccess:
                $ref: '#/components/schemas/DriverRouteAccessContext'
              driverAccess:
                $ref: '#/components/schemas/DriverAccessTokenData'
              companyGuidance:
                $ref: '#/components/schemas/DriverCompanyGuidance'
    DriverMultipleMatchesAccess:
      type: object
      required: [matches, resolutionHint, status]
      properties:
        status:
          const: MULTIPLE_MATCHES
        matches:
          type: array
          items:
            $ref: '#/components/schemas/DriverRouteAccessAmbiguousMatch'
        resolutionHint:
          type: string
    DriverDeniedAccess:
      type: object
      required: [status]
      properties:
        status:
          enum: [BLOCKED, DISABLED, NOT_FOUND]
          type: string
    DriverRouteAccessContext:
      type: object
      required: [nextState, routeContext, routePlanId]
      properties:
        nextState:
          const: consent_required
        routeContext:
          type: string
        routePlanId:
          type: string
    DriverAccessTokenData:
      type: object
      required: [accessToken, expiresAt, tokenType, ttlSeconds, use]
      properties:
        accessToken:
          type: string
        expiresAt:
          format: date-time
          type: string
        tokenType:
          const: Bearer
        ttlSeconds:
          type: integer
          example: 900
        use:
          const: consent_and_assigned_route
        scopes:
          type: array
          description: >-
            Additive app-facing capability metadata. Existing app clients may ignore this field.
            Server authorization for these endpoints uses the signed accountId/routePlanId/tokenVersion
            bearer token and the current route assignment, not scope claims.
          items:
            type: string
    DriverCompanyGuidance:
      type: object
      required: [companyDisplayName, deliveryDate, driverInstructions, executionStatus, operatorSupportContact, pickupGuidance, routeName, shopDomain, timezone]
      properties:
        companyDisplayName:
          type: string
        deliveryDate:
          format: date
          type: string
        driverInstructions:
          type: array
          items:
            type: string
        executionStatus:
          enum: [READY, IN_PROGRESS]
          type: string
        operatorSupportContact:
          type:
            - string
            - 'null'
        pickupGuidance:
          type:
            - string
            - 'null'
        routeName:
          type: string
        shopDomain:
          type: string
        timezone:
          type:
            - string
            - 'null'
    DriverRouteAccessAmbiguousMatch:
      type: object
      required: [companyDisplayName, deliveryDate, routeName, shopDomain, timezone]
      properties:
        companyDisplayName:
          type: string
        deliveryDate:
          format: date
          type: string
        operatorSupportContact:
          type:
            - string
            - 'null'
        pickupGuidance:
          type:
            - string
            - 'null'
        routeName:
          type: string
        shopDomain:
          type: string
        timezone:
          type:
            - string
            - 'null'
    DriverAssignedRouteEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          oneOf:
            - type: object
              required: [status]
              properties:
                status:
                  const: NO_ASSIGNED_ROUTE
            - type: object
              required: [route, status]
              properties:
                status:
                  const: ASSIGNED_ROUTE
                route:
                $ref: '#/components/schemas/DriverAssignedRoute'
        error:
          type: 'null'
    DriverSellerOrder:
      type: object
      required: [addressLabel, itemCount, orderId, orderName, recipientName, sellerOrderKey, sourceSequence]
      properties:
        addressLabel: { type: string }
        itemCount: { type: integer, minimum: 0 }
        orderId: { type: string, format: uuid }
        orderName: { type: string }
        recipientName:
          type: [string, 'null']
        sellerOrderKey: { type: string }
        sourceSequence: { type: integer, minimum: 1 }
      additionalProperties: false
    DriverSellerOrderListEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [orders]
          properties:
            orders:
              type: array
              items: { $ref: '#/components/schemas/DriverSellerOrder' }
        error: { type: 'null' }
    DriverSellerOrderAssignmentEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [groupingId, groupingUpdatedAt, order, routePlanId]
          properties:
            groupingId: { type: string, format: uuid }
            groupingUpdatedAt: { type: string, format: date-time }
            order: { $ref: '#/components/schemas/DriverSellerOrder' }
            routePlanId: { type: string, format: uuid }
        error: { type: 'null' }
    DriverAssignedRoute:
      type: object
      required: [deliveryDate, etaSnapshot, id, name, shopDomain, stops, timezone]
      properties:
        id:
          type: string
        name:
          type: string
        deliveryDate:
          format: date
          type: string
        etaSnapshot:
          $ref: '#/components/schemas/DriverRouteEtaSnapshot'
        shopDomain:
          type: string
        timezone:
          type: string
        stops:
          type: array
          items:
            $ref: '#/components/schemas/DriverAssignedRouteStop'
    DriverAssignedRouteStop:
      type: object
      required: [address, coordinates, deliveryStopId, distanceFromPreviousMeters, durationFromPreviousSeconds, estimatedArrivalAt, orderName, phone, recipientName, sequence, status]
      properties:
        deliveryStopId:
          type: string
        distanceFromPreviousMeters:
          type:
            - integer
            - 'null'
        durationFromPreviousSeconds:
          type:
            - integer
            - 'null'
        estimatedArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
        sequence:
          type: integer
        status:
          type: string
        orderName:
          type: string
        recipientName:
          type:
            - string
            - 'null'
        phone:
          type:
            - string
            - 'null'
        address:
          $ref: '#/components/schemas/ShippingAddress'
        coordinates:
          type:
            - object
            - 'null'
          required: [latitude, longitude]
          properties:
            latitude:
              type: number
            longitude:
              type: number
    DriverRoutesHistoryEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [routes, pageInfo]
          properties:
            routes:
              type: array
              items:
                $ref: '#/components/schemas/DriverRouteHistoryItem'
            pageInfo:
              type: object
              required: [hasNextPage, endCursor]
              properties:
                hasNextPage:
                  type: boolean
                endCursor:
                  type:
                    - string
                    - 'null'
        error:
          type: 'null'
    DriverRouteHistoryItem:
      type: object
      required: [routePlanId, shopDomain, companyDisplayName, name, deliveryDate, timezone, status, stopCount, completedStopCount, failedStopCount, completedAt]
      properties:
        routePlanId:
          type: string
        shopDomain:
          type: string
        companyDisplayName:
          type: string
        name:
          type: string
        deliveryDate:
          format: date
          type: string
        timezone:
          type: string
          description: Valid IANA timezone. Server falls back to UTC rather than device-local time when route config is missing.
        status:
          enum: [pending, active, completed]
          type: string
        stopCount:
          type: integer
          minimum: 0
        completedStopCount:
          type: integer
          minimum: 0
        failedStopCount:
          type: integer
          minimum: 0
        completedAt:
          format: date-time
          type:
            - string
            - 'null'
    DriverRouteFeedbackRequest:
      type: object
      required: [reviewNote]
      properties:
        reviewNote:
          type: string
          minLength: 1
          maxLength: 1000
        submittedAt:
          format: date-time
          type: string
      additionalProperties: false
    DriverRouteFeedbackEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [feedbackId, routePlanId, reviewNote, submittedAt]
          properties:
            feedbackId:
              type: string
            routePlanId:
              type: string
            reviewNote:
              type: string
            submittedAt:
              format: date-time
              type: string
        error:
          type: 'null'
    DriverProfileEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [driver]
          properties:
            driver:
              $ref: '#/components/schemas/DriverSelfProfile'
        error:
          type: 'null'
    DriverSelfProfile:
      type: object
      required: [id, displayName, phone, status]
      properties:
        id:
          type: string
        displayName:
          type: string
        phone:
          type:
            - string
            - 'null'
        status:
          enum: [ACTIVE, INACTIVE, SUSPENDED]
          type: string
    DriverProfileUpdateRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    DriverAccountDeletionRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          const: DELETE
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
      additionalProperties: false
    DriverAccountDeletionEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [duplicate, requestId, status]
          properties:
            duplicate:
              type: boolean
            requestId:
              type: string
            status:
              const: REQUESTED
        error:
          type: 'null'
    DriverEarningsEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [currency, period, summary, items]
          properties:
            currency:
              type: string
              minLength: 3
              maxLength: 3
            period:
              pattern: '^\d{4}-\d{2}$'
              type: string
            summary:
              type: object
              required: [completedRoutes, completedStops, grossAmount, adjustments, estimatedPayout]
              properties:
                completedRoutes:
                  type: integer
                  minimum: 0
                completedStops:
                  type: integer
                  minimum: 0
                grossAmount:
                  type: number
                  const: 0
                adjustments:
                  type: number
                  const: 0
                estimatedPayout:
                  type: number
                  const: 0
            items:
              type: array
              maxItems: 0
        error:
          type: 'null'
    DriverConsentRequest:
      type: object
      required: [consents]
      properties:
        routeContext:
          type:
            - string
            - 'null'
        recordedAt:
          format: date-time
          type: string
        deviceContext:
          type:
            - object
            - 'null'
          additionalProperties: true
        appContext:
          type:
            - object
            - 'null'
          additionalProperties: true
        consents:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/DriverConsentRecordInput'
    DriverConsentRecordInput:
      type: object
      required: [accepted, type, version]
      properties:
        accepted:
          const: true
        type:
          enum: [LOCATION_INFORMATION, PERSONAL_INFORMATION]
          type: string
        version:
          type: string
    DriverConsentEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [recordedAt, records, status]
          properties:
            status:
              const: CONSENT_RECORDED
            recordedAt:
              format: date-time
              type: string
            records:
              type: array
              items:
                type: object
                required: [accepted, type, version]
                properties:
                  accepted:
                    type: boolean
                  type:
                    enum: [LOCATION_INFORMATION, PERSONAL_INFORMATION]
                    type: string
                  version:
                    type: string
        error:
          type: 'null'
    DriverProofMediaUploadRequest:
      type: object
      required: [deliveryStopId, routePlanId, source, file]
      properties:
        deliveryStopId:
          type: string
        routePlanId:
          type: string
        source:
          enum: [camera, library]
          type: string
        file:
          format: binary
          type: string
    DriverProofMediaEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/DriverProofMediaReference'
        error:
          type: 'null'
    DriverProofMediaReference:
      type: object
      required: [contentType, kind, mediaId, source, storageKey, uploadedAt]
      properties:
        kind:
          const: photo
        mediaId:
          type: string
        storageKey:
          type: string
        contentType:
          type: string
        source:
          enum: [camera, library]
          type: string
        uploadedAt:
          format: date-time
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
    DriverProofMediaAccessEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [contentType, expiresAt, kind, mediaId, url]
          properties:
            kind:
              const: photo
            mediaId:
              type: string
            contentType:
              type: string
            url:
              format: uri
              type: string
            expiresAt:
              format: date-time
              type: string
        error:
          type: 'null'
    DriverEventRequest:
      type: object
      required: [eventType, occurredAt]
      description: PICKUP_COMPLETED requires a nonblank clientEventId and deliveryStopId must be omitted or null.
      properties:
        clientEventId:
          description: Client-side idempotency key. Required and nonblank when eventType is PICKUP_COMPLETED.
          type:
            - string
            - 'null'
        deliveryStopId:
          description: Stop-scoped event target. Must be omitted or null when eventType is PICKUP_COMPLETED.
          type:
            - string
            - 'null'
        eventType:
          enum: [ROUTE_STARTED, ROUTE_PAUSED, ROUTE_COMPLETED, PICKUP_COMPLETED, STOP_ARRIVED, STOP_DELIVERED, STOP_FAILED, LOCATION_UPDATED, NOTE_ADDED]
          type: string
        latitude:
          type:
            - number
            - 'null'
        longitude:
          type:
            - number
            - 'null'
        occurredAt:
          format: date-time
          type: string
        routePlanId:
          type:
            - string
            - 'null'
      additionalProperties: true
      examples:
        pickupCompleted:
          value:
            clientEventId: pickup-2026-05-07T06-09-30Z
            deliveryStopId: null
            eventType: PICKUP_COMPLETED
            occurredAt: '2026-05-07T06:09:30.000Z'
            routePlanId: route-plan-id
    DriverEventEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [duplicate, eventId]
          properties:
            duplicate:
              type: boolean
            etaUpdate:
              $ref: '#/components/schemas/DriverRouteEtaUpdate'
            etaSnapshot:
              $ref: '#/components/schemas/DriverRouteEtaSnapshot'
            eventId:
              type: string
        error:
          type: 'null'
    DriverRouteEtaSnapshot:
      type: object
      required: [status, pickupCompletedAt, nextStopEta, remainingRouteEta, failureCode, failureMessage, calculatedAt]
      properties:
        status:
          enum: [PRE_PICKUP, READY, FAILED]
          type: string
        pickupCompletedAt:
          format: date-time
          type:
            - string
            - 'null'
        nextStopEta:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DriverRouteEtaNextStop'
        remainingRouteEta:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DriverRouteEtaRemainingRoute'
        failureCode:
          type:
            - string
            - 'null'
        failureMessage:
          type:
            - string
            - 'null'
        calculatedAt:
          format: date-time
          type:
            - string
            - 'null'
    DriverRouteEtaNextStop:
      type: object
      required: [deliveryStopId, sequence, distanceFromPreviousMeters, estimatedArrivalAt]
      properties:
        deliveryStopId:
          type: string
        sequence:
          type: integer
        distanceFromPreviousMeters:
          type:
            - integer
            - 'null'
        estimatedArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
    DriverRouteEtaRemainingRoute:
      type: object
      required: [distanceMeters, estimatedCompletionAt]
      properties:
        distanceMeters:
          type:
            - integer
            - 'null'
        estimatedCompletionAt:
          format: date-time
          type:
            - string
            - 'null'
    DriverRouteEtaUpdate:
      type: object
      required: [actualArrivalAt, deliveryStopId, delaySeconds, etaCalculatedAt, etaFailureCode, etaFailureMessage, etaStatus, previousEstimatedArrivalAt, serverReceivedAt, trigger, updatedStops]
      properties:
        actualArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
        deliveryStopId:
          type:
            - string
            - 'null'
        delaySeconds:
          type:
            - integer
            - 'null'
        etaCalculatedAt:
          format: date-time
          type: string
        etaFailureCode:
          type:
            - string
            - 'null'
        etaFailureMessage:
          type:
            - string
            - 'null'
        etaStatus:
          enum: [READY, FAILED]
          type: string
        previousEstimatedArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
        serverReceivedAt:
          format: date-time
          type: string
        trigger:
          enum: [ROUTE_STARTED, STOP_ARRIVED, STOP_DELIVERED, PICKUP_COMPLETED]
          type: string
        updatedStops:
          type: array
          items:
            $ref: '#/components/schemas/DriverRouteEtaStopUpdate'
    DriverRouteEtaStopUpdate:
      type: object
      required: [deliveryStopId, estimatedArrivalAt, sequence]
      properties:
        deliveryStopId:
          type: string
        estimatedArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
        sequence:
          type: integer
    ShippingAddress:
      type: object
      properties:
        address1:
          type:
            - string
            - 'null'
        address2:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        province:
          type:
            - string
            - 'null'
        postalCode:
          type:
            - string
            - 'null'
        countryCode:
          type:
            - string
            - 'null'
      additionalProperties: false
    KeyValueAttribute:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
      additionalProperties: false
    DeliveryServiceType:
      enum: [DELIVERY, EVENING_DELIVERY, PICKUP]
      type: string
