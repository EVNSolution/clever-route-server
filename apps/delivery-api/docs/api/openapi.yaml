        data:
          type: object
          required: [driver]
          properties:
            driver:
              $ref: '#/components/schemas/DriverSelfProfile'
        error:
          type: 'null'
    DriverSelfProfile:
      type: object
      required: [id, displayName, phone, status]
      properties:
        id:
          type: string
        displayName:
          type: string
        phone:
          type:
            - string
            - 'null'
        status:
          enum: [ACTIVE, INACTIVE, SUSPENDED]
          type: string
    DriverProfileUpdateRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    DriverAccountDeletionRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          const: DELETE
        reason:
          type:
            - string
            - 'null'
          maxLength: 500
      additionalProperties: false
    DriverAccountDeletionEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [duplicate, requestId, status]
          properties:
            duplicate:
              type: boolean
            requestId:
              type: string
            status:
              const: REQUESTED
        error:
          type: 'null'
    DriverEarningsEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [currency, period, summary, items]
          properties:
            currency:
              type: string
              minLength: 3
              maxLength: 3
            period:
              pattern: '^\d{4}-\d{2}$'
              type: string
            summary:
              type: object
              required: [completedRoutes, completedStops, grossAmount, adjustments, estimatedPayout]
              properties:
                completedRoutes:
                  type: integer
                  minimum: 0
                completedStops:
                  type: integer
                  minimum: 0
                grossAmount:
                  type: number
                  const: 0
                adjustments:
                  type: number
                  const: 0
                estimatedPayout:
                  type: number
                  const: 0
            items:
              type: array
              maxItems: 0
        error:
          type: 'null'
    DriverConsentRequest:
      type: object
      required: [consents]
      properties:
        routeContext:
          type:
            - string
            - 'null'
        recordedAt:
          format: date-time
          type: string
        deviceContext:
          type:
            - object
            - 'null'
          additionalProperties: true
        appContext:
          type:
            - object
            - 'null'
          additionalProperties: true
        consents:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/DriverConsentRecordInput'
    DriverConsentRecordInput:
      type: object
      required: [accepted, type, version]
      properties:
        accepted:
          const: true
        type:
          enum: [LOCATION_INFORMATION, PERSONAL_INFORMATION]
          type: string
        version:
          type: string
    DriverConsentEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [recordedAt, records, status]
          properties:
            status:
              const: CONSENT_RECORDED
            recordedAt:
              format: date-time
              type: string
            records:
              type: array
              items:
                type: object
                required: [accepted, type, version]
                properties:
                  accepted:
                    type: boolean
                  type:
                    enum: [LOCATION_INFORMATION, PERSONAL_INFORMATION]
                    type: string
                  version:
                    type: string
        error:
          type: 'null'
    DriverProofMediaUploadRequest:
      type: object
      required: [deliveryStopId, routePlanId, source, file]
      properties:
        deliveryStopId:
          type: string
        routePlanId:
          type: string
        source:
          enum: [camera, library]
          type: string
        file:
          format: binary
          type: string
    DriverProofMediaEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/DriverProofMediaReference'
        error:
          type: 'null'
    DriverProofMediaReference:
      type: object
      required: [contentType, kind, mediaId, source, storageKey, uploadedAt]
      properties:
        kind:
          const: photo
        mediaId:
          type: string
        storageKey:
          type: string
        contentType:
          type: string
        source:
          enum: [camera, library]
          type: string
        uploadedAt:
          format: date-time
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        sha256:
          type: string
    DriverProofMediaAccessEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [contentType, expiresAt, kind, mediaId, url]
          properties:
            kind:
              const: photo
            mediaId:
              type: string
            contentType:
              type: string
            url:
              format: uri
              type: string
            expiresAt:
              format: date-time
              type: string
        error:
          type: 'null'
    DriverEventRequest:
      type: object
      required: [eventType, occurredAt]
      description: PICKUP_COMPLETED requires a nonblank clientEventId and deliveryStopId must be omitted or null.
      properties:
        clientEventId:
          description: Client-side idempotency key. Required and nonblank when eventType is PICKUP_COMPLETED.
          type:
            - string
            - 'null'
        deliveryStopId:
          description: Stop-scoped event target. Must be omitted or null when eventType is PICKUP_COMPLETED.
          type:
            - string
            - 'null'
        eventType:
          enum: [ROUTE_STARTED, ROUTE_PAUSED, ROUTE_COMPLETED, PICKUP_COMPLETED, STOP_ARRIVED, STOP_DELIVERED, STOP_FAILED, LOCATION_UPDATED, NOTE_ADDED]
          type: string
        latitude:
          type:
            - number
            - 'null'
        longitude:
          type:
            - number
            - 'null'
        occurredAt:
          format: date-time
          type: string
        routePlanId:
          type:
            - string
            - 'null'
      additionalProperties: true
      examples:
        pickupCompleted:
          value:
            clientEventId: pickup-2026-05-07T06-09-30Z
            deliveryStopId: null
            eventType: PICKUP_COMPLETED
            occurredAt: '2026-05-07T06:09:30.000Z'
            routePlanId: route-plan-id
    DriverEventEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: object
          required: [duplicate, eventId]
          properties:
            duplicate:
              type: boolean
            etaUpdate:
              $ref: '#/components/schemas/DriverRouteEtaUpdate'
            etaSnapshot:
              $ref: '#/components/schemas/DriverRouteEtaSnapshot'
            eventId:
              type: string
        error:
          type: 'null'
    DriverRouteEtaSnapshot:
      type: object
      required: [status, pickupCompletedAt, nextStopEta, remainingRouteEta, failureCode, failureMessage, calculatedAt]
      properties:
        status:
          enum: [PRE_PICKUP, READY, FAILED]
          type: string
        pickupCompletedAt:
          format: date-time
          type:
            - string
            - 'null'
        nextStopEta:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DriverRouteEtaNextStop'
        remainingRouteEta:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DriverRouteEtaRemainingRoute'
        failureCode:
          type:
            - string
            - 'null'
        failureMessage:
          type:
            - string
            - 'null'
        calculatedAt:
          format: date-time
          type:
            - string
            - 'null'
    DriverRouteEtaNextStop:
      type: object
      required: [deliveryStopId, sequence, distanceFromPreviousMeters, estimatedArrivalAt]
      properties:
        deliveryStopId:
          type: string
        sequence:
          type: integer
        distanceFromPreviousMeters:
          type:
            - integer
            - 'null'
        estimatedArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
    DriverRouteEtaRemainingRoute:
      type: object
      required: [distanceMeters, estimatedCompletionAt]
      properties:
        distanceMeters:
          type:
            - integer
            - 'null'
        estimatedCompletionAt:
          format: date-time
          type:
            - string
            - 'null'
    DriverRouteEtaUpdate:
      type: object
      required: [actualArrivalAt, deliveryStopId, delaySeconds, etaCalculatedAt, etaFailureCode, etaFailureMessage, etaStatus, previousEstimatedArrivalAt, serverReceivedAt, trigger, updatedStops]
      properties:
        actualArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
        deliveryStopId:
          type:
            - string
            - 'null'
        delaySeconds:
          type:
            - integer
            - 'null'
        etaCalculatedAt:
          format: date-time
          type: string
        etaFailureCode:
          type:
            - string
            - 'null'
        etaFailureMessage:
          type:
            - string
            - 'null'
        etaStatus:
          enum: [READY, FAILED]
          type: string
        previousEstimatedArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
        serverReceivedAt:
          format: date-time
          type: string
        trigger:
          enum: [ROUTE_STARTED, STOP_ARRIVED, PICKUP_COMPLETED]
          type: string
        updatedStops:
          type: array
          items:
            $ref: '#/components/schemas/DriverRouteEtaStopUpdate'
    DriverRouteEtaStopUpdate:
      type: object
      required: [deliveryStopId, estimatedArrivalAt, sequence]
      properties:
        deliveryStopId:
          type: string
        estimatedArrivalAt:
          format: date-time
          type:
            - string
            - 'null'
        sequence:
          type: integer
    ShippingAddress:
      type: object
      properties:
        address1:
          type:
            - string
            - 'null'
        address2:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        province:
          type:
            - string
            - 'null'
        postalCode:
          type:
            - string
            - 'null'
        countryCode:
          type:
            - string
            - 'null'
      additionalProperties: false
    KeyValueAttribute:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
      additionalProperties: false
    DeliveryServiceType:
