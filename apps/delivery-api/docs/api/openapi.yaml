          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountAuthSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /driver/account/profile:
    get:
      tags: [Driver Mobile]
      summary: Read the authenticated phone-account profile
      operationId: getDriverAccountProfile
      x-source-file: src/routes/driver-auth.routes.ts
      security:
        - DriverAccountAccessToken: []
      responses:
        '200':
          description: Phone-account profile independent from shop driver aliases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Driver Mobile]
      summary: Update the authenticated phone-account name
      operationId: updateDriverAccountProfile
      x-source-file: src/routes/driver-auth.routes.ts
      security:
        - DriverAccountAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverAccountProfileUpdateRequest'
      responses:
        '200':
          description: Updated phone-account profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountProfileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/driver/mobile/push-token:
    put:
      tags: [Driver Mobile]
      summary: Register or refresh one mobile installation for the authenticated driver account
      operationId: registerDriverPushInstallation
      x-source-file: src/routes/driver-auth.routes.ts
      security:
        - DriverAccountAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverPushInstallationRequest'
      responses:
        '200':
          description: Installation token registered for the global driver account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPushInstallationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Driver Mobile]
      summary: Revoke one mobile installation for the authenticated driver account
      operationId: revokeDriverPushInstallation
      x-source-file: src/routes/driver-auth.routes.ts
      security:
        - DriverAccountAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [devicePushToken]
              properties:
                devicePushToken:
                  type: string
                  minLength: 1
              additionalProperties: false
      responses:
        '200':
          description: Matching account installation revoked when present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPushRevocationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /driver/route-access/lookup:
    post:
      tags: [Driver Mobile]
      summary: Account-authenticated route access lookup for the driver app
      operationId: lookupDriverRouteAccess
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccountAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRouteAccessLookupRequest'
      responses:
        '200':
          description: Safe route-access result. Denials use HTTP 200 with status in data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRouteAccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /driver/assigned-route:
    get:
      tags: [Driver Mobile]
      summary: Read the exact route assigned to the bearer-token account
      operationId: getDriverAssignedRoute
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      parameters:
        - name: routeContext
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Assigned route details or a safe empty status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAssignedRouteEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/orders/unassigned:
    get:
      tags: [Driver Mobile]
      summary: List unassigned SellerOrder rows in the bearer route group
      operationId: listDriverUnassignedSellerOrders
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      responses:
        '200':
          description: Whole SellerOrder rows currently available for acquisition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSellerOrderListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/orders/{orderId}/acquire:
    post:
      tags: [Driver Mobile]
      summary: Atomically acquire one unassigned SellerOrder row
      operationId: acquireDriverSellerOrder
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The complete SellerOrder row moved to the bearer route and the route was recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSellerOrderAssignmentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another driver acquired the order first, the assignment changed, the route departed, or the target route has no vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: The affected route data cannot be recalculated from the current order coordinates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Route recalculation is not configured in this runtime.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /driver/orders/{orderId}/release:
    post:
      tags: [Driver Mobile]
      summary: Release one SellerOrder row without deleting it
      operationId: releaseDriverSellerOrder
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The complete SellerOrder row moved to an unassigned route and the source route was recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSellerOrderAssignmentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The assignment changed or the route already departed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: The affected route data cannot be recalculated from the current order coordinates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Route recalculation is not configured in this runtime.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /driver/routes:
    get:
      tags: [Driver Mobile]
      summary: List route-history summaries for the bearer-token driver
      operationId: listDriverRoutes
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            format: date
            type: string
        - name: to
          in: query
          required: false
          schema:
            format: date
            type: string
        - name: status
          in: query
          required: false
          schema:
            enum: [pending, active, completed]
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Token-scoped route summary list. Actionable stop/proof details remain on `/driver/assigned-route`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRoutesHistoryEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/routes/{routePlanId}/feedback:
    post:
      tags: [Driver Mobile]
      summary: Record a route-level driver review note
      operationId: submitDriverRouteFeedback
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      parameters:
        - $ref: '#/components/parameters/RoutePlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRouteFeedbackRequest'
      responses:
        '201':
          description: Driver route feedback was accepted and persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRouteFeedbackEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/profile:
    get:
      tags: [Driver Mobile]
      summary: Read the bearer-token driver's self profile
      operationId: getDriverProfile
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      responses:
        '200':
          description: Token-scoped driver profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Driver Mobile]
      summary: Update the bearer-token driver's display name only
      operationId: updateDriverProfile
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
      responses:
        '200':
          description: Updated token-scoped driver profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfileEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/account-deletion-requests:
    post:
      tags: [Driver Mobile]
      summary: Request account deletion without deleting operational records
      operationId: requestDriverAccountDeletion
      x-source-file: src/routes/driver-events.routes.ts
      description: >-
        Global phone-account receive path. A DriverAccount bearer is preferred and
        creates one idempotent account-scoped audit request. The legacy route bearer
        remains temporarily accepted for backward compatibility. This endpoint does
        not delete, anonymize, revoke tokens, remove proof media, or alter route assignments.
      security:
        - DriverAccountAccessToken: []
        - DriverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverAccountDeletionRequest'
      responses:
        '202':
          description: Deletion request was accepted for later policy handling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAccountDeletionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /driver/earnings:
    get:
      tags: [Driver Mobile]
      summary: Read conservative earnings readiness for the bearer-token driver
      operationId: getDriverEarnings
      x-source-file: src/routes/driver-events.routes.ts
      description: >-
        Returns completed scoped work counts with zero monetary values until payout/rate rules are approved.
      security:
        - DriverAccessToken: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            pattern: '^\d{4}-\d{2}$'
            type: string
          example: 2026-05
      responses:
        '200':
          description: Scoped earnings readiness response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEarningsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /driver/consents:
    post:
      tags: [Driver Mobile]
      summary: Record required driver consent evidence
      operationId: recordDriverConsents
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverConsentRequest'
      responses:
        '201':
          description: Consent evidence recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverConsentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Consent persistence failed without exposing internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                failed:
                  value:
                    data: null
                    error:
                      code: CONSENT_RECORD_FAILED
                      message: Driver consent could not be recorded
  /driver/proof-media/{mediaId}/access:
    get:
      tags: [Driver Mobile]
      summary: Create short-lived read access for driver proof media
      operationId: getDriverProofMediaAccess
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Short-lived proof media read access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProofMediaAccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Proof-media read access is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                unavailable:
                  value:
                    data: null
                    error:
                      code: PROOF_MEDIA_ACCESS_UNAVAILABLE
                      message: Proof media access is not configured
  /driver/proof-media:
    post:
      tags: [Driver Mobile]
      summary: Upload proof-of-delivery media
      operationId: uploadDriverProofMedia
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverProofMediaUploadRequest'
      responses:
        '201':
          description: Proof media metadata was persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProofMediaEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Proof media was rejected by safety scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                rejected:
                  value:
                    data: null
                    error:
                      code: PROOF_MEDIA_REJECTED
                      message: Proof media rejected by safety scan
  /driver/events:
    post:
      tags: [Driver Mobile]
      summary: Record an idempotent driver event
      operationId: recordDriverEvent
      x-source-file: src/routes/driver-events.routes.ts
      security:
        - DriverAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverEventRequest'
      responses:
        '200':
          description: Duplicate event already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEventEnvelope'
        '202':
          description: Event was accepted and recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEventEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    DsvSessionCookie:
      type: apiKey
      in: cookie
      name: clever_dsv_admin
      description: Shop-scoped HTTP-only DSV operator session cookie.
    DsvCsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token issued with the shop-scoped DSV operator session.
    ShopifySessionToken:
      type: http
      scheme: bearer
      bearerFormat: Shopify App Bridge session JWT
      description: Server-verified Shopify embedded app session token.
    DriverAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-issued short-lived account/route JWT with audience clever-delivery-driver-route.
    DriverAccountAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-issued short-lived phone-account JWT with audience clever-driver-account.
    ShopifyWebhookHmac:
      type: apiKey
      in: header
      name: X-Shopify-Hmac-Sha256
      description: Base64 HMAC generated by Shopify over the raw request body.
  parameters:
    AdminUiCsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Same-origin admin UI CSRF token issued in the authenticated browser session.
    RouteOpsShopDomainQuery:
      name: shopDomain
      in: query
      required: false
      schema:
        type: string
      description: Required when the admin UI session is not already scoped to one WordPress/Woo shop domain.
    DsvV1ServiceDateQuery:
      name: serviceDate
      in: query
      required: false
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Optional service date. Runtime rejects non-YYYY-MM-DD values.
    DsvV1OrderNumberQuery:
      name: orderNumber
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
      description: Case-insensitive partial match against SellerOrderKey.
    DsvV1DestinationNameQuery:
      name: destinationName
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
      description: Case-insensitive partial match against the canonical destination name or stop recipient name.
    DsvV1CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Opaque pagination cursor. Runtime rejects blank or repeated cursor parameters.
    DsvV1LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Optional page size. Runtime defaults to 50 and rejects non-integer, blank, repeated, or out-of-range values.
    DsvV1WindowQuery:
      name: window
      in: query
      required: false
      schema:
        type: string
        enum: [today, tomorrow, day-after-tomorrow]
      description: Customer delivery date window resolved in the tenant timezone.
    DsvV1SellerOrderIdPath:
      name: sellerOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Canonical seller-order identifier.
    DsvV1AssignmentIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 120
        pattern: '\S'
      description: >-
        Client command identifier. Required when commandId is omitted from the request body;
        when both values are supplied they must match after runtime trimming.
    RoutePlanId:
      name: routePlanId
      in: path
      required: true
      schema:
        type: string
    DeliveryStopId:
      name: deliveryStopId
      in: path
      required: true
      schema:
        type: string
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
    ShopifyTopicHeader:
      name: X-Shopify-Topic
      in: header
      required: true
      schema:
        type: string
      example: orders/create
    ShopifyShopDomainHeader:
      name: X-Shopify-Shop-Domain
      in: header
      required: true
      schema:
        pattern: '^[a-z0-9][a-z0-9-]*\.myshopify\.com$'
        type: string
      example: example.myshopify.com
    ShopifyWebhookIdHeader:
      name: X-Shopify-Webhook-Id
      in: header
      required: true
      schema:
        type: string
    ShopifyApiVersionHeader:
      name: X-Shopify-API-Version
      in: header
      required: false
      schema:
        type: string
      example: 2026-04
    ShopifyEventIdHeader:
      name: X-Shopify-Event-Id
      in: header
      required: false
      schema:
        type: string
    ShopifyTriggeredAtHeader:
      name: X-Shopify-Triggered-At
      in: header
      required: false
      schema:
        format: date-time
        type: string
  responses:
    BadRequest:
      description: Invalid request payload, query, path, or headers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid bearer token or HMAC.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller is outside the requested shop/driver/route scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Requested resource was not found under the authenticated boundary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Request conflicts with existing route/order assignment state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DsvSchemaNotReady:
      description: A required DSV schema migration has not been applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DsvV1BadRequest:
      description: Unsupported or invalid DSV v1 query parameter or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
    DsvV1Unauthenticated:
      description: Missing or invalid DSV v1 browser session cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
    DsvV1Forbidden:
      description: Authenticated principal lacks the required DSV v1 scope or principal type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
    DsvV1DependencyUnavailable:
      description: DSV v1 read dependency is unavailable or not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DsvV1ErrorEnvelope'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
    RoutesAppInstallUnavailableResponse:
      type: object
      required: [message, ok]
      properties:
        message:
          type: string
          const: Routes app download is not configured.
        ok:
          type: boolean
          const: false
      additionalProperties: false
    RoutesAppAndroidReleaseEnvelope:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/RoutesAppAndroidRelease'
        error:
