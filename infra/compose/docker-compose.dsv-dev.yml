name: clever-dsv-dev

x-api-environment: &api-environment
  DATABASE_URL: postgresql://clever:clever@postgres:5432/clever_route

services:
  postgres:
    image: postgres:17-bookworm
    env_file:
      - ../../apps/delivery-api/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clever -d clever_route"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - dsv-postgres-g007-migrate-deploy:/var/lib/postgresql/data

  schema:
    build:
      context: ../..
      dockerfile: apps/delivery-api/Dockerfile
      target: runtime
    command: ["/app/scripts/dsv-g007-migrate-deploy.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../apps/delivery-api/.env
    environment:
      <<: *api-environment
      DSV_MIGRATION_MODE: compose-dev
      DSV_DEV_FRESH_VOLUME: "1"
      DSV_DEV_VOLUME_NAME: dsv-postgres-g007-migrate-deploy
    restart: "no"

  seed:
    build:
      context: ../..
      dockerfile: apps/delivery-api/Dockerfile
      target: build
    command: ["sh", "-c", "cd apps/delivery-api && npm run dsv:dispatch-demo:seed"]
    depends_on:
      schema:
        condition: service_completed_successfully
    env_file:
      - ../../apps/delivery-api/.env
    environment:
      <<: *api-environment
    restart: "no"

  delivery-api:
    build:
      context: ../..
      dockerfile: apps/delivery-api/Dockerfile
      target: runtime
    depends_on:
      seed:
        condition: service_completed_successfully
    env_file:
      - ../../apps/delivery-api/.env
    environment: *api-environment
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('node:http');const req=http.get('http://127.0.0.1:3000/healthz',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));\""]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

volumes:
  dsv-postgres-g007-migrate-deploy:
